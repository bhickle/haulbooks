    const { useState, useMemo, useRef, useCallback, useEffect } = React;
// -----------------------------------------------------------------------------
// PDF VIEWER
// -----------------------------------------------------------------------------
function PdfViewer({ b64 }) {
  const canvasRef = useRef(null);
  const [numPages, setNumPages] = useState(0);
  const [currentPage, setCurrentPage] = useState(1);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const docRef = useRef(null);
  useEffect(() => {
    if (!b64) return;
    setLoading(true); setError(false);
    const load = async () => {
      try {
        const pdfjsLib = window.pdfjsLib;
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const binary = atob(b64), bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
        docRef.current = doc; setNumPages(doc.numPages); setLoading(false); renderPage(doc, 1);
      } catch(e) { setError(true); setLoading(false); }
    };
    if (window.pdfjsLib) { load(); return; }
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = load; s.onerror = () => { setError(true); setLoading(false); };
    document.head.appendChild(s);
  }, [b64]);
  const renderPage = async (doc, pageNum) => {
    if (!canvasRef.current || !doc) return;
    const page = await doc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = canvasRef.current;
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  };
  const goToPage = (p) => { if (!docRef.current) return; setCurrentPage(p); renderPage(docRef.current, p); };
  if (loading) return <div style={{textAlign:"center",padding:"40px",color:"#7d8590"}}>Loading PDF...</div>;
  if (error) return <div style={{textAlign:"center",padding:"40px",color:"#f85149"}}>Could not render PDF</div>;
  return (
    <div>
      <div style={{overflowX:"auto",borderRadius:"8px",border:"1px solid #21262d",background:"#fff"}}>
        <canvas ref={canvasRef} style={{display:"block",maxWidth:"100%"}} />
      </div>
      {numPages > 1 && (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"12px",marginTop:"8px"}}>
          <button onClick={()=>goToPage(Math.max(1,currentPage-1))} disabled={currentPage===1} style={{padding:"4px 10px",background:"#1c2330",border:"1px solid #21262d",borderRadius:"6px",color:"#e6edf3",cursor:"pointer",fontSize:"12px"}}>←</button>
          <span style={{fontSize:"12px",color:"#7d8590"}}>Page {currentPage} of {numPages}</span>
          <button onClick={()=>goToPage(Math.min(numPages,currentPage+1))} disabled={currentPage===numPages} style={{padding:"4px 10px",background:"#1c2330",border:"1px solid #21262d",borderRadius:"6px",color:"#e6edf3",cursor:"pointer",fontSize:"12px"}}>→</button>
        </div>
      )}
    </div>
  );
}

// CONSTANTS
// -----------------------------------------------------------------------------
const C = {
  bg:"#0d1117",surface:"#161b22",surfaceHigh:"#1c2330",border:"#21262d",borderHi:"#30363d",
  orange:"#e8833a",orangeD:"#e8833a18",teal:"#3fb950",tealD:"#3fb95018",
  blue:"#58a6ff",blueD:"#58a6ff18",yellow:"#d29922",yellowD:"#d2992218",
  red:"#f85149",redD:"#f8514918",purple:"#bc8cff",purpleD:"#bc8cff18",
  text:"#e6edf3",muted:"#7d8590",faint:"#1c2330",
};
const BUSINESS_CATS = ["Fuel","Mileage","Truck Maintenance","Trailer Maintenance","Vehicle Wash & Road Services","Dump Fees","Tolls","Parking","Truck Insurance","Trailer Insurance","Business Insurance","Truck Loan Interest","Loan Payment (Principal)","Registration & Tags","Tools & Equipment","Contract Labor","Licenses & Fees","Phone / Cell","Internet","Marketing","Office / Admin","Utilities","Other Business"];
const ALL_CATS = [...BUSINESS_CATS];
const PAY_METHODS = ["Cash","Venmo","Zelle","Check","Card"];
// The shape of the job -- one per job, kept non-overlapping. Used everywhere a
// job type is chosen, including leads, so a converted lead can't produce a type
// the job form is unable to show.
// Mirrors the three services on the logo: junk removal | property cleanouts |
// light demolition. Estate cleanouts and rental turnovers are the same work --
// emptying a property -- so they are one type; the circumstance lives in the notes.
const HAULING_TYPES = ["Junk Removal","Property Cleanout","Demo / Teardown","Other"];
// What was actually hauled. Separate from the type because most jobs are a mix
// ("furniture and hot tub"), so forcing one label throws the rest away.
const JOB_TAGS = ["Shed","Hot Tub","Furniture","Appliances","Deck / Fencing","Yard Waste","Construction Debris","Garage / Basement"];
const JOB_TYPE_COLORS = {"Junk Removal":"#e8833a","Property Cleanout":"#bc8cff","Demo / Teardown":"#f85149","Other":"#7d8590"};
const TAX_MAP = {
  "Fuel":"Vehicle Expenses","Mileage":"Vehicle Expenses","Truck Maintenance":"Vehicle Expenses",
  "Trailer Maintenance":"Vehicle Expenses","Vehicle Wash & Road Services":"Vehicle Expenses",
  "Tolls":"Vehicle Expenses","Parking":"Vehicle Expenses","Truck Insurance":"Insurance",
  "Trailer Insurance":"Insurance","Business Insurance":"Insurance","Truck Loan Interest":"Interest (Loan)",
  "Loan Payment (Principal)":"[Non-Deductible] Principal","Registration & Tags":"Taxes & Licenses",
  "Tools & Equipment":"Equipment","Contract Labor":"Contract Labor","Licenses & Fees":"Licenses & Fees",
  "Phone / Cell":"Utilities","Internet":"Utilities","Marketing":"Advertising","Office / Admin":"Office Expenses",
  "Dump Fees":"Cost of Services","Utilities":"Utilities","Other Business":"Miscellaneous",
};
// List queries leave receipt_b64 out (it's megabytes), so presence has to be
// judged from the metadata columns, which are always loaded.
const hasReceipt = (e) => !!(e && (e.receiptB64 || e.receiptImg || e.receiptFileName || e.receiptMediaType));
// Purposes that count as business use. "Personal" is the only one that doesn't,
// and it has to be selectable or the business-use share can't be worked out.
const TRIP_PURPOSES = ["Business","Job","Estimate","Dump Run","Supply Run","Equipment","Personal"];

// Running the truck is only deductible for the share of miles that were for
// work, so these categories get scaled by the business-use percentage.
// Tolls and Parking are deliberately absent: a toll paid on a work trip is
// deductible in full. "Mileage" is absent because it belongs to the standard
// mileage method, which is an alternative to deducting these costs at all.
const VEHICLE_CATS = ["Fuel","Truck Maintenance","Trailer Maintenance","Vehicle Wash & Road Services",
                      "Truck Insurance","Trailer Insurance","Truck Loan Interest","Registration & Tags"];

// Business-use share for a set of trips. Total miles come from the odometer,
// not from adding the trips up: the gap between them is real driving that was
// never logged, and counting only logged trips silently inflates the share.
function businessUse(trips){
  if(!trips.length) return null;
  const num = (v)=>{const n=parseFloat(v); return isNaN(n)?null:n;};
  const starts=trips.map(t=>num(t.startOdometer)).filter(v=>v!==null);
  const ends=trips.map(t=>num(t.endOdometer)).filter(v=>v!==null);
  const logged=trips.reduce((s,t)=>s+(t.miles||0),0);
  const personal=trips.filter(t=>t.purpose==="Personal").reduce((s,t)=>s+(t.miles||0),0);
  const business=logged-personal;
  const span=(starts.length&&ends.length)?Math.max(...ends)-Math.min(...starts):0;
  // Fall back to logged miles if the odometer readings are missing or look wrong.
  const usableSpan = span>=logged ? span : logged;
  const total = usableSpan||logged;
  return {
    total, logged, business, personal,
    unlogged: Math.max(0, usableSpan-logged),
    fromOdometer: span>=logged&&span>0,
    pct: total>0 ? business/total : 0,
  };
}

const phoneDigits = (p) => String(p==null?"":p).replace(/\D/g,"");
const fmtPhone = (p) => {
  const d=phoneDigits(p);
  if(d.length===10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  if(d.length===11&&d[0]==="1") return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  return String(p==null?"":p);
};
const fmt = (n) => "$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

const tod = () => new Date().toISOString().split("T")[0];
const monthLabel = (m) => { const [y,mo]=m.split("-"); return new Date(y,mo-1).toLocaleString("en-US",{month:"long",year:"numeric"}); };

// deliberately absent -- there is no meals category, so those get flagged instead.
const ISSUER_CAT_MAP = {
  "Gas":"Fuel", "Automotive":"Truck Maintenance", "Office & Shipping":"Office / Admin",
  "Repair & Maintenance":"Tools & Equipment", "Merchandise & Inventory":"Tools & Equipment",
  "Bills & Utilities":"Utilities", "Professional Services":"Office / Admin",

};

// Lines that are the card being paid off, or a credit back to it. Needed because
// some issuers (PNC) export no transaction-type column at all.
const PAYMENT_RE = /THANK YOU FOR YOUR PMT|ONLINE CREDIT CARD PMT|AUTOMATIC PAYMENT|PAYMENT\s*-?\s*THANK|AUTOPAY|^\s*PAYMENT\b/i;
const CREDIT_RE  = /CASH ?BACK|REWARD|REBATE|STATEMENT CREDIT/i;

const htmlUnescape = (s) => { const t=document.createElement("textarea"); t.innerHTML=s||""; return t.value; };
// Strip store numbers and punctuation so "LOWES #00120*" and "LOWES #02247*" match.
const normMerchant = (d) => htmlUnescape(d||"").toUpperCase()
  .replace(/[*#_\/]/g," ").replace(/\b\d{3,}\b/g," ").replace(/\s+/g," ").trim();
// Human-readable fallback name when no rule or history matches the descriptor.
const prettyMerchant = (d) => htmlUnescape(d||"")
  .replace(/^\s*(SQ|TST|SP|PY|PAYPAL|POS)\s*\*\s*/i,"")
  .replace(/[*#_]/g," ").replace(/\b\d{3,}\b/g," ").replace(/\s+/g," ").trim()
  .toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());

const dayGap = (a,b) => Math.round(Math.abs(new Date(a+"T12:00:00") - new Date(b+"T12:00:00"))/86400000);
const stmtDate = (s) => {
  s=(s||"").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  return m ? `${m[3]}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}` : "";
};
const stmtAmount = (s) => {
  const raw=String(s==null?"":s).trim();
  const paren=/^\(.*\)$/.test(raw);
  const n=parseFloat(raw.replace(/[^0-9.\-]/g,""));
  if(isNaN(n)) return NaN;
  return paren ? -Math.abs(n) : n;
};

// Minimal RFC-4180 CSV reader (handles quoted fields containing commas/newlines).
function parseCsvText(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"'){ q=true; }
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c!=="\r"){ cur+=c; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}

// Turn raw CSV text into normalized statement lines. Throws on unrecognized files.
function readStatement(text){
  const grid=parseCsvText(text);
  if(grid.length<2) throw new Error("That file has no transactions in it.");
  const head=grid[0].map(h=>h.trim().toLowerCase());
  const find=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const iDate=find("transaction date","trans date","date","posted date");
  const iPost=find("post date","posting date");
  const iDesc=find("description","payee","merchant","name");
  const iAmt =find("amount","debit");
  const iType=find("type","transaction type");
  const iCat =find("category");
  const iCard=find("card","card no.","account");
  if(iDate<0||iDesc<0||iAmt<0) throw new Error("Could not find Date, Description and Amount columns. Export the CSV from your card issuer without changing the headers.");
  const out=[];
  for(let r=1;r<grid.length;r++){
    const g=grid[r];
    const date=stmtDate(g[iDate]); const amount=stmtAmount(g[iAmt]);
    if(!date||isNaN(amount)) continue;
    out.push({
      date, postDate: iPost>=0?stmtDate(g[iPost]):"",
      desc: htmlUnescape((g[iDesc]||"").trim()),
      amount,
      type: iType>=0?(g[iType]||"").trim():"",
      issuerCat: iCat>=0?(g[iCat]||"").trim():"",
      card: iCard>=0?(g[iCard]||"").trim():"",
    });
  }
  if(!out.length) throw new Error("No readable transactions found in that file.");

  // Issuers disagree on which way a purchase points: Chase writes purchases
  // negative and payments positive, PNC does the exact opposite. Guessing wrong
  // would offer the card payments as expenses, so work it out per file. A
  // payment always has the opposite sign to a purchase; if there are none to
  // learn from, fall back to the majority, since most lines are purchases.
  const pays=out.filter(t=>PAYMENT_RE.test(t.desc));
  let purchaseSign=0;
  if(pays.length){
    const s=Math.sign(pays.reduce((a,t)=>a+t.amount,0));
    if(s) purchaseSign=-s;
  }
  if(!purchaseSign){
    const npos=out.filter(t=>t.amount>0).length;
    purchaseSign = npos*2>=out.length ? 1 : -1;
  }
  // Normalise to "a purchase is negative", which is what everything downstream assumes.
  if(purchaseSign>0) out.forEach(t=>{ t.amount = -t.amount; });
  return out;
}

// Stable identity for a statement line. The trailing occurrence index keeps two
// genuinely separate but identical charges (same day, merchant and amount) apart,
// and stays stable across re-downloads because it only counts within its own group.
const fingerprintOf = (t, occurrence) =>
  [t.card||"", t.date, t.postDate||"", normMerchant(t.desc), t.amount.toFixed(2), occurrence].join("|");

// What kind of line is this? Only 'expense' is a real cost.
function classifyLine(t){
  const ty=(t.type||"").toLowerCase();
  // Description first: it's the only signal when the export has no type column.
  // Checked before the type so "Returned Payment" still reads as a reversal.
  if(ty.includes("reversal")) return "reversal";   // negative but NOT a cost
  if(PAYMENT_RE.test(t.desc)) return "payment";    // paying the card off
  if(CREDIT_RE.test(t.desc)) return "credit";      // cash-back / rewards credit
  if(ty.includes("payment")) return "payment";
  if(ty.includes("return")||ty.includes("refund")) return "refund";
  if(t.amount>0) return "credit";
  return "expense";
}

const VendorInput = ({value, onChange, placeholder="e.g. Sheetz, Lowe's", vendors, addVendor}) => {
  const [query, setQuery] = useState(value||"");
  const [open, setOpen] = useState(false);
  const [highlightIdx, setHighlightIdx] = useState(0);
  useEffect(()=>{ setQuery(value||""); },[value]);
  const matches = query.length>0 ? vendors.filter(v=>v.toLowerCase().includes(query.toLowerCase())).slice(0,8) : vendors.slice(0,8);
  const showAddNew = query.trim().length>0 && !vendors.find(v=>v.toLowerCase()===query.trim().toLowerCase());
  const select=(name)=>{const added=addVendor(name);setQuery(added);onChange(added);setOpen(false);};
  const handleKey=(e)=>{
    const total=matches.length+(showAddNew?1:0);
    if(e.key==="ArrowDown"){e.preventDefault();setHighlightIdx(i=>Math.min(i+1,total-1));}
    else if(e.key==="ArrowUp"){e.preventDefault();setHighlightIdx(i=>Math.max(i-1,0));}
    else if(e.key==="Enter"){e.preventDefault();if(highlightIdx<matches.length)select(matches[highlightIdx]);else if(showAddNew)select(query.trim());}
    else if(e.key==="Escape"){setOpen(false);}
  };
  const inpStyle={width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,padding:"9px 12px",fontSize:"14px",boxSizing:"border-box",fontFamily:"inherit",transition:"border-color 0.15s"};
  return (
    <div style={{position:"relative"}}>
      <input style={inpStyle} placeholder={placeholder} value={query} autoComplete="off"
        onChange={e=>{setQuery(e.target.value);onChange(e.target.value);setOpen(true);setHighlightIdx(0);}}
        onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)} onKeyDown={handleKey}/>
      {open&&(matches.length>0||showAddNew)&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,background:C.surface,border:`1px solid ${C.border}`,borderRadius:"7px",zIndex:300,maxHeight:"200px",overflowY:"auto",marginTop:"2px",boxShadow:"0 4px 16px rgba(0,0,0,0.4)"}}>
          {matches.map((v,i)=>(
            <div key={v} onMouseDown={()=>select(v)} style={{padding:"8px 12px",cursor:"pointer",background:i===highlightIdx?C.faint:"transparent",fontSize:"13px",borderBottom:`1px solid ${C.faint}`}}>{v}</div>
          ))}
          {showAddNew&&(
            <div onMouseDown={()=>select(query.trim())} style={{padding:"8px 12px",cursor:"pointer",background:highlightIdx===matches.length?C.faint:"transparent",fontSize:"13px",color:C.teal,borderTop:matches.length>0?`1px solid ${C.border}`:"none",display:"flex",alignItems:"center",gap:"6px"}}>
              <span style={{fontWeight:"700"}}>+</span> Add "{query.trim()}"
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const receiptNo = (job) => {
  const d=(job.date||"").replace(/-/g,"");
  const tail=String(job.id||"").replace(/\D/g,"").slice(-4).padStart(4,"0");
  return `MVH-${d}-${tail}`;
};

// jsPDF on demand, same lazy pattern as the PDF viewer.
let _jspdfLoading=null;
const loadJsPDF = () => {
  if(window.jspdf&&window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if(_jspdfLoading) return _jspdfLoading;
  _jspdfLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>res(window.jspdf.jsPDF);
    s.onerror=()=>rej(new Error("Could not load the PDF library. Check your connection and try again."));
    document.head.appendChild(s);
  });
  return _jspdfLoading;
};

// Draws the receipt onto a Letter-size page and hands back the jsPDF doc.
function buildReceiptPdf(JsPDF, job, biz){
  const doc=new JsPDF({unit:"pt",format:"letter"});
  const W=doc.internal.pageSize.getWidth();
  const M=54;                       // page margin
  const ink="#111827", soft="#6b7280", line="#e5e7eb";

  // Dark header band -- the wordmark is white and needs it.
  const bandH=96;
  doc.setFillColor(0,0,0); doc.rect(0,0,W,bandH,"F");
  const logoW=Math.min(300, W-2*M), logoH=logoW/LOGO_ASPECT;
  doc.addImage(LOGO_DATA_URI,"PNG",M,(bandH-logoH)/2,logoW,logoH);
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(19);
  doc.text("RECEIPT", W-M, bandH/2-4, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(190,190,190);
  doc.text(receiptNo(job), W-M, bandH/2+12, {align:"right"});

  let y=bandH+34;
  doc.setTextColor(ink);

  // Who it's from / who it's for
  const colR=W/2+10;
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(soft);
  doc.text("FROM", M, y); doc.text("BILLED TO", colR, y);
  y+=14; doc.setTextColor(ink); doc.setFontSize(11);
  doc.text(biz.name||"Mon Valley Hauling & Services", M, y);
  doc.text(job.customer||"Customer", colR, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(soft);
  let yl=y+14, yr=y+14;
  (biz.address||"").split("\n").filter(Boolean).forEach(l=>{doc.text(l,M,yl); yl+=12;});
  if(biz.phone){doc.text(fmtPhone(biz.phone),M,yl); yl+=12;}
  if(biz.email){doc.text(biz.email,M,yl); yl+=12;}
  (job.address||"").split("\n").filter(Boolean).forEach(l=>{doc.text(l,colR,yr); yr+=12;});
  if(job.phone){doc.text(fmtPhone(job.phone),colR,yr); yr+=12;}

  y=Math.max(yl,yr)+18;
  doc.setDrawColor(line); doc.line(M,y,W-M,y); y+=22;

  // The work
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(soft);
  doc.text("DATE",M,y); doc.text("SERVICE",M+86,y); doc.text("AMOUNT",W-M,y,{align:"right"});
  y+=8; doc.setDrawColor(line); doc.line(M,y,W-M,y); y+=18;

  doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(ink);
  doc.text(fmtDate(job.date),M,y);
  doc.text(job.jobType||"Hauling",M+86,y);
  doc.text(fmt(job.amount),W-M,y,{align:"right"});
  y+=15;
  doc.setFontSize(9.5); doc.setTextColor(soft);
  if((job.tags||[]).length){ doc.text(job.tags.join(" · "), M+86, y); y+=13; }
  if(job.notes){
    const clean=String(job.notes).replace(/\s*\[Converted from lead\]\s*/,"").trim();
    if(clean) doc.splitTextToSize(clean, W-M-(M+86)).slice(0,6).forEach(l=>{doc.text(l,M+86,y); y+=12;});
  }

  y+=10; doc.setDrawColor(line); doc.line(M,y,W-M,y); y+=24;
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(ink);
  doc.text("TOTAL",W-M-140,y); doc.text(fmt(job.amount),W-M,y,{align:"right"});

  // Paid marker
  y+=30;
  doc.setFillColor(220,252,231); doc.roundedRect(W-M-168,y-16,168,26,4,4,"F");
  doc.setTextColor(22,101,52); doc.setFontSize(10);
  doc.text(`PAID  ·  ${job.paymentMethod||"Cash"}`, W-M-12, y+1, {align:"right"});

  // Footer: the note on the left, how to reach him on the right. The tagline
  // deliberately isn't here -- it's already part of the logo at the top, and
  // repeating it just read as filler.
  const fy=doc.internal.pageSize.getHeight()-64;
  doc.setDrawColor(line); doc.line(M,fy-18,W-M,fy-18);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(soft);
  if(biz.footerNote) doc.text(biz.footerNote,M,fy);
  const contact=[biz.phone?fmtPhone(biz.phone):"",biz.email||""].filter(Boolean).join("   ·   ");
  if(contact) doc.text(contact,W-M,fy,{align:"right"});
  return doc;
}

  // -- Statement import ------------------------------------------------------
  // Turn parsed statement lines into reviewable rows: suggest a payee/category,
  // work out what each line is, and flag anything already in the books.
  const buildImportRows = useCallback((lines)=>{
    // What category has each payee historically been given?
    const counts={}, display={};
    expenses.forEach(e=>{
      const k=normMerchant(e.payee); if(!k) return;
      counts[k]=counts[k]||{}; counts[k][e.category]=(counts[k][e.category]||0)+1;
      if(!display[k]) display[k]=e.payee;
    });
    const best={};
    Object.keys(counts).forEach(k=>{
      const sorted=Object.entries(counts[k]).sort((a,b)=>b[1]-a[1]);
      // If a payee is split across categories (Xfinity: Internet vs Phone) don't guess.
      best[k]= sorted.length>1 && sorted[0][1]===sorted[1][1] ? "" : sorted[0][0];
    });
    // Existing expenses indexed by amount so a charge can also be matched to an
    // entry logged a day or two off. That happens constantly: a receipt gets
    // entered on the day it was pumped while the card dates it the next day, and
    // an exact-date-only check silently lets those through as duplicates.
    const byAmount={};
    expenses.forEach(e=>{
      const a=Math.abs(Number(e.amount)).toFixed(2);
      (byAmount[a]=byAmount[a]||[]).push({date:e.date,used:false});
    });
    // Claim the closest unused entry of this amount within maxDays. Returns the
    // gap in days, or null if there's nothing to match.
    const claim=(amt,date,maxDays)=>{
      const list=byAmount[amt]; if(!list) return null;
      let best=null;
      list.forEach(x=>{
        if(x.used) return;
        const g=dayGap(x.date,date);
        if(g<=maxDays&&(best===null||g<best.g)) best={x,g};
      });
      if(!best) return null;
      best.x.used=true; return best.g;
    };

    const seen={};
    return lines.map(t=>{
      const norm=normMerchant(t.desc);
      const groupKey=[t.card||"",t.date,t.postDate||"",norm,t.amount.toFixed(2)].join("|");
      const occ=(seen[groupKey]=(seen[groupKey]||0)+1)-1;
      const fp=fingerprintOf(t,occ);
      const kind=classifyLine(t);

      let payee="", category="", why="";
      const rule=MERCHANT_RULES.find(r=>r[0].test(norm));
      if(rule){ payee=rule[1]; category=rule[2]; why="known merchant"; }
      if(!category){
        const hit=Object.keys(best).find(k=>k.length>2&&(norm===k||norm.indexOf(k)>=0||k.indexOf(norm)>=0));
        if(hit){ payee=payee||display[hit]; category=best[hit]; if(category) why="matches your history"; }
      }
      if(!category&&ISSUER_CAT_MAP[t.issuerCat]){ category=ISSUER_CAT_MAP[t.issuerCat]; why="issuer category"; }
      if(!payee) payee=prettyMerchant(t.desc);

      let status="new", note="", include=(kind==="expense");
      if(kind==="payment"){ status="payment"; note="Card payment, not an expense"; include=false; }
      else if(kind==="reversal"){ status="reversal"; note="Reversed payment, not an expense"; include=false; }
      else if(kind==="refund"||kind==="credit"){ status="refund"; note="Refund - include to subtract it"; include=false; }
      else {
        const amt=Math.abs(t.amount).toFixed(2);
        const near=claim(amt,t.date,3);   // 0 = same day, 1-3 = logged a few days off
        if(near===0){ status="logged"; note="Already in your expenses"; include=false; }
        else if(near!==null){
          status="maybedup";
          note=`Same amount already logged ${near} day${near===1?"":"s"} away - check before ticking`;
          include=false;
        }
        // Nothing we could categorise -- often a personal charge. Left unticked
        // so it can never be swept into the books without a deliberate choice.
        else if(!category){ status="needcat"; note="Unrecognised - tick and categorise if it's a business cost"; include=false; }
      }
      const handled=ledger.has(fp);
      if(handled){ status="handled"; note="Imported or excluded previously"; include=false; }
      return {fp,date:t.date,postDate:t.postDate,desc:t.desc,card:t.card,type:t.type,
              amount:Math.abs(t.amount),signed:t.amount,kind,payee,category,why,status,note,include,handled};
    });
  },[expenses,ledger]);

      setImportState("review"); return;

    setExpenses(p=>[...newExps,...p]);

  };

    setLeads(p=>p.map(l=>l.id===lead.id?updated:l));

  const saveExpense=async()=>{
    if(!expForm.desc||!expForm.amount)return;
    const id=editingId||"exp_"+Date.now();
    const rec={id,date:expForm.date,desc:expForm.desc,category:expForm.category,type:"business",flipId:null,propertyId:null,amount:parseFloat(expForm.amount),payee:expForm.payee||"",notes:expForm.notes||"",receiptImg:null,receiptB64:expForm.receiptB64||null,receiptMediaType:expForm.receiptMediaType||null,receiptIsPdf:expForm.receiptIsPdf||false,receiptFileName:expForm.receiptFileName||null};
    if(expForm.payee)addVendor(expForm.payee);
    try{
      if(editingId){
        // Send only what was edited. The receipt columns are included solely
        // when the receipt itself changed, so an unloaded image is never
        // overwritten with a blank one.
        const patch={date:rec.date,description:rec.desc,category:rec.category,type:rec.type,
                     flip_id:null,property_id:null,amount:rec.amount,payee:rec.payee||null,notes:rec.notes||null};
        if(expForm.receiptDirty) Object.assign(patch,{
          receipt_b64:rec.receiptB64||null,receipt_media_type:rec.receiptMediaType||null,
          receipt_is_pdf:rec.receiptIsPdf||false,receipt_file_name:rec.receiptFileName||null});
        await sb.update("expenses",editingId,patch);
      } else {
        await sb.upsert("expenses",fromExpense(rec));
      }
    }catch(e){console.error("Save expense:",e);}
    if(editingId){
      setExpenses(p=>p.map(e=>{
        if(e.id!==editingId) return e;
        const merged={...e,...rec};
        // Mirror the save: an untouched receipt keeps whatever the row already had.
        if(!expForm.receiptDirty){
          merged.receiptB64=e.receiptB64; merged.receiptMediaType=e.receiptMediaType;
          merged.receiptIsPdf=e.receiptIsPdf; merged.receiptFileName=e.receiptFileName;
        }
        return merged;
      }));
    } else { setExpenses(p=>[rec,...p]); }

            {/* -- LEADS TAB -- */}
            {haulingTab==="leads"&&(()=>{
              const LEAD_STATUSES=[["new","New",C.blue],["estimate_sent","Estimate Sent",C.yellow],["won","Won",C.teal],["lost","Lost",C.red],["complete","Complete",C.muted]];
              const getLeadCol=(s)=>LEAD_STATUSES.find(x=>x[0]===s)?.[2]||C.muted;
              const getLeadLabel=(s)=>LEAD_STATUSES.find(x=>x[0]===s)?.[1]||s;
              const openLeads=leads.filter(l=>!["lost","complete"].includes(l.status));
              const closedLeads=leads.filter(l=>["lost","complete"].includes(l.status));
              const totalEstimated=openLeads.reduce((s,l)=>s+(l.estimatedAmount||0),0);
              const wonLeads=leads.filter(l=>l.status==="won");
              const convRate=leads.filter(l=>l.status!=="new"&&l.status!=="estimate_sent").length>0?Math.round((wonLeads.length/leads.filter(l=>["won","lost"].includes(l.status)).length)*100):null;
              return <>
                <div style={{marginBottom:"16px",display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>

                  {[[`${upcoming.length} Upcoming`,"jobs",C.blue],[`${past.length} Overdue`,past.length>0?"needs action":"all good",past.length>0?C.red:C.teal],[`This Week`,upcoming.filter(l=>{const d=new Date(l.scheduledDate),n=new Date(today2);return (d-n)/(1000*60*60*24)<=7;}).length+" jobs",C.orange]].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"18px",fontWeight:"700",color:col,marginTop:"4px"}}>{v}</div></div>

                          </div>
                        </div>

            {/* -- JOBS TAB -- */}
            {haulingTab==="jobs"&&(()=>{
              const dateOnly=haulingIncome.filter(i=>inDateRange(i.date,fHaulingJobs));
              const filtered=dateOnly.filter(i=>(!jobTagFilter||(i.tags||[]).indexOf(jobTagFilter)>=0)
                                             && (!jobCustomer||i.customer===jobCustomer))
                                     .sort((a,b)=>b.date.localeCompare(a.date));
              const total=filtered.reduce((s,i)=>s+i.amount,0);
              // Anyone who has hired him more than once, across all time rather than
              // the current date filter -- a customer from last year is still a repeat.
              const repeats=Object.values(haulingIncome.reduce((m,i)=>{
                const k=i.customer||"(no name)";
                if(!m[k]) m[k]={name:k,n:0,sum:0,last:"",phone:""};
                m[k].n++; m[k].sum+=i.amount;
                if(i.date>m[k].last){m[k].last=i.date; m[k].phone=i.phone||m[k].phone;}
                return m;
              },{})).filter(c=>c.n>1).sort((a,b)=>b.sum-a.sum);
              const activeCustomer=jobCustomer?repeats.find(c=>c.name===jobCustomer)||
                (()=>{const rows=haulingIncome.filter(i=>i.customer===jobCustomer);
                      return {name:jobCustomer,n:rows.length,sum:rows.reduce((s,i)=>s+i.amount,0),
                              last:rows.map(r=>r.date).sort().pop(),phone:(rows.find(r=>r.phone)||{}).phone||""};})()
                :null;
              // Revenue by type, biggest first, so the cards follow the work rather
              // than a hardcoded pair that goes stale whenever the list changes.
              const byType=HAULING_TYPES.map(t=>{
                const rows=filtered.filter(i=>i.jobType===t);
                return {t,n:rows.length,sum:rows.reduce((s,i)=>s+i.amount,0)};
              }).filter(x=>x.n>0).sort((a,b)=>b.sum-a.sum);
              // Tag counts come from the date range, not the tag filter, so the
              // chips don't vanish as soon as one is picked.
              const tagStats=JOB_TAGS.map(tg=>{
                const rows=dateOnly.filter(i=>(i.tags||[]).indexOf(tg)>=0);
                return {tg,n:rows.length,sum:rows.reduce((s,i)=>s+i.amount,0)};
              }).filter(x=>x.n>0).sort((a,b)=>b.sum-a.sum);
              const anyFilter=jobTagFilter||jobCustomer;
              // name -> how many jobs, for the "3× customer" marker on each row
              const repeatNames=haulingIncome.reduce((m,i)=>{m[i.customer]=(m[i.customer]||0)+1;return m;},{});
              return <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",flexWrap:"wrap",gap:"8px"}}>

                  </div>
                )}

                <button onClick={()=>setJobStatsOpen(o=>!o)}
                  style={{width:"100%",textAlign:"left",background:"transparent",border:`1px solid ${C.border}`,borderRadius:"8px",
                          color:C.muted,padding:"8px 12px",fontSize:"11px",cursor:"pointer",marginBottom:"10px",
                          letterSpacing:"1px",textTransform:"uppercase"}}>
                  {jobStatsOpen?"▾":"▸"} Breakdown by type, what you hauled, repeat customers
                </button>

                {jobStatsOpen&&(<>
                <div style={S.g4}>

                {isMobile?(
                  <div style={{marginTop:"12px",display:"flex",flexDirection:"column",gap:"8px"}}>

                          <span style={S.badge(JOB_TYPE_COLORS[i.jobType]||C.orange)}>{i.jobType}</span>
                          <span style={S.badge(C.blue)}>{i.paymentMethod}</span>
                          {repeatNames[i.customer]>1&&<span style={S.badge(C.teal)}>{repeatNames[i.customer]}× customer</span>}
                        </div>
                        {(i.tags||[]).length>0&&(
                          <div style={{display:"flex",gap:"3px",flexWrap:"wrap",marginTop:"5px"}}>
                            {i.tags.map(tg=><span key={tg} style={{fontSize:"9px",color:C.blue,background:C.blueD,border:`1px solid ${C.blue}33`,borderRadius:"4px",padding:"1px 5px"}}>{tg}</span>)}

                      </div>

                  </div>
                ):(
                  <div style={{...S.card,marginTop:"16px"}}><table style={S.tbl}><thead><tr>{["Date","Customer","Phone","Type","Payment","Amount",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                    {filtered.length===0&&<tr><td colSpan={7} style={{...S.td,textAlign:"center",color:C.muted,padding:"36px"}}>No jobs in this period</td></tr>}
                    {filtered.map(i=>(

                  </tbody></table></div>

            })()}

            {/* -- EXPENSES TAB -- */}
            {haulingTab==="expenses"&&(()=>{
              const dateFiltered=haulingExpenses.filter(e=>inDateRange(e.date,fHaulingExp));
              const filtered=dateFiltered.filter(e=>{
                if(expSearch&&!e.desc.toLowerCase().includes(expSearch.toLowerCase())&&!(e.payee||"").toLowerCase().includes(expSearch.toLowerCase())&&!(e.notes||"").toLowerCase().includes(expSearch.toLowerCase())) return false;
                if(expFilterPayee&&e.payee!==expFilterPayee) return false;
                if(expFilterCat&&e.category!==expFilterCat) return false;
                return true;
              }).sort((a,b)=>b.date.localeCompare(a.date));
              const total=filtered.reduce((s,e)=>s+e.amount,0);

                </div>
                <div style={S.g3}>
                  {[["Total Expenses",fmt(total),C.red],["Deductible",fmt(deductible),C.orange],["Non-Deductible (Principal)",fmt(total-deductible),C.muted]].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"18px",fontWeight:"700",color:col,marginTop:"4px"}}>{v}</div></div>
                  ))}
                </div>
                {isMobile?(
                  <div style={{marginTop:"12px",display:"flex",flexDirection:"column",gap:"8px"}}>
                    {filtered.length===0&&<div style={{...S.card,textAlign:"center",color:C.muted,padding:"36px"}}>No expenses in this period</div>}

                            </div>
                            <div style={{display:"flex",gap:"6px",marginTop:"5px",flexWrap:"wrap",alignItems:"center"}}>
                              <span style={{fontSize:"11px",color:C.muted}}>{fmtDate(e.date)}</span>
                              <span style={S.badge(C.blue)}>{e.category}</span>
                              {e.payee&&<span style={{fontSize:"11px",color:C.muted}}>{e.payee}</span>}
                            </div>
                          </div>
                          <div style={{fontWeight:"700",fontSize:"15px",color:C.red,whiteSpace:"nowrap"}}>{fmt(e.amount)}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                ):(
                  <div style={{...S.card,marginTop:"16px"}}><table style={S.tbl}><thead><tr>{["Date","Description","Category","Payee","Amount",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                    {filtered.length===0&&<tr><td colSpan={6} style={{...S.td,textAlign:"center",color:C.muted,padding:"36px"}}>No expenses in this period</td></tr>}
                    {filtered.map(e=>(
                      <tr key={e.id} className="hrow" style={{cursor:"pointer"}} onClick={()=>{openViewExpense(e);}}>
                        <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(e.date)}</td>
                        <td style={S.td}><div style={{display:"flex",alignItems:"center",gap:"5px"}}>{hasReceipt(e)&&<span>🧾</span>}<div><div>{e.desc}</div>{e.notes&&<div style={{fontSize:"11px",color:C.muted}}>{e.notes}</div>}</div></div></td>

            })()}

            {/* -- MILEAGE TAB -- */}
            {haulingTab==="mileage"&&(()=>{
              const filtered=trips.filter(t=>inDateRange(t.date,fMile)).sort((a,b)=>b.date.localeCompare(a.date));
              const totalMiles=filtered.reduce((s,t)=>s+t.miles,0);
              const bizMiles=filtered.filter(t=>t.purpose!=="Personal").reduce((s,t)=>s+t.miles,0);
              const ActiveTripBanner=(()=>{
                if(!activeTrip)return null;
                const elapsed=Math.floor((Date.now()-activeTrip.startedAt)/60000);
                const hrs=Math.floor(elapsed/60),mins=elapsed%60;
                const elapsedStr=hrs>0?`${hrs}h ${mins}m`:`${mins}m`;
                return (
                  <div style={{...S.card,border:`2px solid ${C.teal}`,background:C.tealD,marginBottom:"16px",position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",top:0,left:0,right:0,height:"2px",background:`linear-gradient(90deg,${C.teal},transparent)`,animation:"pulse 2s infinite"}}/>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
                      <div>
                        <div style={{display:"flex",alignItems:"center",gap:"8px"}}>

                        </div>
                      </div>
                      <div style={{display:"flex",gap:"8px"}}>

                    </div>

                );

                  {[["Total Miles",totalMiles.toFixed(1)+" mi",C.blue],["Business Miles",bizMiles.toFixed(1)+" mi",C.teal],["Business Use",totalMiles>0?(bizMiles/totalMiles*100).toFixed(1)+"%":"--",C.orange]].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"20px",fontWeight:"700",color:col,marginTop:"4px"}}>{v}</div></div>
                  ))}
                </div>
                {isMobile?(
                  <div style={{marginTop:"12px",display:"flex",flexDirection:"column",gap:"8px"}}>
                    {filtered.length===0&&<div style={{...S.card,textAlign:"center",color:C.muted,padding:"36px"}}>No trips logged</div>}

                      <div key={t.id} style={{...S.card,padding:"14px",borderLeft:`3px solid ${t.purpose==="Personal"?C.muted:C.teal}`}}>

                          <div style={{fontWeight:"600",fontSize:"13px",flex:1}}>{t.desc||"Trip"}</div>
                          <div style={{fontWeight:"700",color:C.blue,whiteSpace:"nowrap"}}>{t.miles} mi</div>
                        </div>
                        <div style={{display:"flex",gap:"6px",marginTop:"5px",flexWrap:"wrap",alignItems:"center"}}>
                          <span style={{fontSize:"11px",color:C.muted}}>{fmtDate(t.date)}</span>
                          <span style={S.badge(t.purpose==="Personal"?C.muted:C.teal)}>{t.purpose}</span>
                          {t.startOdometer&&<span style={{fontSize:"11px",color:C.muted}}>{t.startOdometer}→{t.endOdometer}</span>}
                        </div>
                        <div style={{display:"flex",gap:"8px",marginTop:"8px"}}>
                          <button onClick={()=>startEditTrip(t)} style={{...S.bgh,flex:"none",fontSize:"11px",padding:"4px 10px",color:C.blue,borderColor:C.blue+"44"}}>Edit</button>
                          <button onClick={()=>deleteTrip(t.id)} style={{...S.bgh,flex:"none",fontSize:"11px",padding:"4px 10px",color:C.red,borderColor:C.red+"44"}}>Delete</button>
                        </div>
                      </div>
                    ))}
                  </div>
                ):(
                  <div style={{...S.card,marginTop:"16px"}}><table style={S.tbl}><thead><tr>{["Date","Description","Purpose","Start Odo","End Odo","Miles",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                    {filtered.length===0&&<tr><td colSpan={7} style={{...S.td,textAlign:"center",color:C.muted,padding:"36px"}}>No trips logged</td></tr>}
                    {filtered.map(t=>(
                      <tr key={t.id}>
                        <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(t.date)}</td>
                        <td style={{...S.td,fontWeight:"600"}}>{t.desc}</td>
                        <td style={S.td}><span style={S.badge(t.purpose==="Personal"?C.muted:C.teal)}>{t.purpose}</span></td>
                        <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{t.startOdometer||"--"}</td>
                        <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{t.endOdometer||"--"}</td>
                        <td style={{...S.td,fontWeight:"700"}}>{t.miles} mi</td>
                        <td style={S.td}><button onClick={()=>startEditTrip(t)} style={{...S.xBtn,color:C.blue,fontSize:"12px",fontWeight:"700"}}>Edit</button><button onClick={()=>deleteTrip(t.id)} style={S.xBtn}>×</button></td>
                      </tr>
                    ))}
                  </tbody></table></div>
                )}
              </>;
            })()}

            {/* -- ASSETS TAB -- */}
            {haulingTab==="assets"&&(
              <>
                <div style={{...S.card,background:C.yellowD,border:`1px solid ${C.yellow}44`,marginBottom:"16px",fontSize:"12px",color:C.yellow}}>

                <div style={S.g3}>
                  {[["Total Asset Value",fmt(assets.reduce((s,a)=>s+a.cost,0)),C.orange],["Items Tracked",assets.length+" assets",C.blue],["Section 179","Consult accountant",C.yellow]].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"16px",fontWeight:"700",color:col,marginTop:"6px"}}>{v}</div></div>

                <div style={{...S.card,marginTop:"16px"}}><table style={S.tbl}><thead><tr>{["Date","Asset","Vendor","Cost","Notes",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>

                  {assets.map(a=>(
                    <tr key={a.id}>
                      <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(a.date)}</td>
                      <td style={{...S.td,fontWeight:"700"}}>{a.name}</td>
                      <td style={{...S.td,color:C.muted}}>{a.vendor}</td>

                    </tr>

                  {assets.length>0&&<tr style={{borderTop:`2px solid ${C.border}`}}><td colSpan={3} style={{...S.td,fontWeight:"700",color:C.muted,fontSize:"11px"}}>TOTAL</td><td style={{...S.td,fontWeight:"700",color:C.orange,fontSize:"16px"}}>{fmt(assets.reduce((s,a)=>s+a.cost,0))}</td><td colSpan={2} style={S.td}/></tr>}
                </tbody></table></div>
              </>
            )}
          </>
        )}

        {/* ==================================================================
            REPORTS MODULE
        ================================================================== */}
        {view==="reports"&&(()=>{
          const inRange=(date)=>{if(reportRange==="year")return date.startsWith(reportYear);return date>=reportStart&&date<=reportEnd;};

          // -- Shared date filter bar --
          const FilterBar = () => (
            <div style={{...S.card,marginBottom:"16px",display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap"}}>
              <div style={{display:"flex",gap:"4px"}}>
                <button style={{...S.tb(reportRange==="year",C.blue),flex:"none",padding:"5px 12px",fontSize:"11px"}} onClick={()=>setReportRange("year")}>Year</button>
                <button style={{...S.tb(reportRange==="custom",C.purple),flex:"none",padding:"5px 12px",fontSize:"11px"}} onClick={()=>setReportRange("custom")}>Custom</button>
              </div>
              {reportRange==="year"?(
                <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                  {allDataYears.map(y=><button key={y} style={{...S.tb(reportYear===y,C.orange),flex:"none",padding:"5px 14px",fontSize:"12px",fontWeight:"700"}} onClick={()=>setReportYear(y)}>{y}</button>)}
                </div>
              ):(
                <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                  <input type="date" style={{...S.inp,width:"auto"}} value={reportStart} onChange={e=>setReportStart(e.target.value)}/>
                  <span style={{color:C.muted}}>→</span>
                  <input type="date" style={{...S.inp,width:"auto"}} value={reportEnd} onChange={e=>setReportEnd(e.target.value)}/>
                </div>
              )}
            </div>
          );

          // -- Drill-down modal --
          const DrillModal = () => {
            if(!drillData) return null;
            return (
              <div style={S.modal} onClick={e=>e.target===e.currentTarget&&setDrillData(null)}>
                <div style={{...S.mbox,maxWidth:"640px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
                    <div style={{fontWeight:"700",fontSize:"16px"}}>{drillData.title}</div>
                    <button onClick={()=>setDrillData(null)} style={S.xBtn}>×</button>
                  </div>
                  <div style={{fontSize:"12px",color:C.muted,marginBottom:"12px"}}>{drillData.rows.length} transactions · {fmt(drillData.rows.reduce((s,r)=>s+r.amount,0))}</div>
                  <div style={{overflowY:"auto",maxHeight:"400px"}}>
                    <table style={S.tbl}><thead><tr>{["Date","Description","Payee","Amount",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                      {drillData.rows.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>(
                        <tr key={r.id} onClick={()=>{setDrillData(null);startEditExpense(r);setModal("expense");}} style={{cursor:"pointer"}}>
                          <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(r.date)}</td>
                          <td style={S.td}>{r.desc}</td>
                          <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{r.payee||"--"}</td>
                          <td style={{...S.td,fontWeight:"700"}}>{fmt(r.amount)}</td>
                          <td style={S.td} onClick={ev=>ev.stopPropagation()}><button onClick={()=>deleteExpense(r.id)} style={{...S.xBtn,color:C.red}}>×</button></td>
                        </tr>
                      ))}
                    </tbody></table>
                  </div>
                  <div style={{...S.br,marginTop:"16px"}}>
                    <button style={S.bgh} onClick={()=>setDrillData(null)}>Close</button>
                  </div>
                </div>
              </div>
            );
          };

          // Drillable number cell
          const Drill = ({rows, children, col=C.text}) => (
            <span onClick={()=>rows&&rows.length>0&&setDrillData({title:typeof children==="string"?children:"Transactions",rows})}
              style={{color:col,cursor:rows&&rows.length>0?"pointer":"default",textDecoration:rows&&rows.length>0?"underline dotted":"none",textUnderlineOffset:"3px"}}>
              {children}
            </span>
          );

          return (
          <>
            <DrillModal/>

            {/* -- HAULING REPORT -- */}
            {(()=>{
              const rInc=haulingIncome.filter(i=>inRange(i.date));
              const rExp=haulingExpenses.filter(e=>inRange(e.date));
              const rDed=rExp.filter(e=>e.category!=="Loan Payment (Principal)");
              const totalInc=rInc.reduce((s,i)=>s+i.amount,0);

              // Truck costs are only deductible for the business share of the miles.
              const rTrips=trips.filter(t=>inRange(t.date));
              const use=businessUse(rTrips);
              const usePct=use?use.pct:1;                       // no trips logged -> don't scale
              const isVehicle=(c)=>VEHICLE_CATS.indexOf(c)>=0;
              const deductible=(e)=>isVehicle(e.category)?e.amount*usePct:e.amount;
              const vehicleGross=rDed.filter(e=>isVehicle(e.category)).reduce((s,e)=>s+e.amount,0);
              const vehicleNet=vehicleGross*usePct;
              const totalDed=rDed.reduce((s,e)=>s+deductible(e),0);
              const netProfit=totalInc-totalDed;
              // Using the standard mileage rate and deducting running costs are
              // alternatives, so flag it if both appear in the same period.
              const mileageCatUsed=rDed.some(e=>e.category==="Mileage");

              // Monthly P&L
              const monthMap={};
              rInc.forEach(i=>{const m=i.date.slice(0,7);if(!monthMap[m])monthMap[m]={inc:0,incRows:[],expRows:[]};monthMap[m].inc+=i.amount;monthMap[m].incRows.push(i);});
              rExp.forEach(e=>{const m=e.date.slice(0,7);if(!monthMap[m])monthMap[m]={inc:0,incRows:[],expRows:[]};monthMap[m].expRows.push(e);});
              const months=Object.entries(monthMap).sort((a,b)=>b[0].localeCompare(a[0]));

              // Schedule C tax map
              const taxMap={};
              rDed.forEach(e=>{const k=TAX_MAP[e.category]||"Miscellaneous";if(!taxMap[k])taxMap[k]=[];taxMap[k].push(e);});
              const taxSum=(rows)=>rows.reduce((s,e)=>s+deductible(e),0);
              const taxRows=Object.entries(taxMap).sort((a,b)=>taxSum(b[1])-taxSum(a[1]));

              return (<>
                <FilterBar/>
                <div style={S.g3}>
                  {[{l:"Revenue",v:fmt(totalInc),col:C.teal,sub:`${rInc.length} jobs`},{l:"Deductible Exp.",v:fmt(totalDed),col:C.red,sub:"Schedule C"},{l:"Net Profit",v:fmt(netProfit),col:netProfit>=0?C.teal:C.red,sub:"After deductibles"}].map(s=>(
                    <div key={s.l} style={S.card}><div style={S.sl}>{s.l}</div><div style={{...S.sv,color:s.col,marginTop:"4px"}}>{s.v}</div><div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{s.sub}</div></div>
                  ))}
                </div>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"24px",marginBottom:"8px",borderBottom:`1px solid ${C.border}`,paddingBottom:"6px"}}>
                  <span style={{fontSize:"10px",color:C.muted,letterSpacing:"3px",textTransform:"uppercase"}}>Monthly P&amp;L -- click any row to drill in</span>
                  <div style={{display:"flex",gap:"6px"}}>
                    <button onClick={()=>exportCSV("hauling-jobs")} style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px"}}>Jobs CSV</button>
                    <button onClick={()=>exportCSV("hauling-exp")} style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px"}}>Expenses CSV</button>
                  </div>
                </div>
                <div style={S.card}><table style={S.tbl}><thead><tr>{["Month","Revenue","Expenses","Net"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                  {months.length===0&&<tr><td colSpan={4} style={{...S.td,textAlign:"center",color:C.muted,padding:"24px"}}>No data for this period</td></tr>}
                  {months.map(([m,d])=>{
                    const exp=d.expRows.reduce((s,e)=>s+e.amount,0);
                    const net=d.inc-exp;
                    return(
                      <tr key={m} className="hrow" style={{cursor:"pointer"}} onClick={()=>setDrillData({title:monthLabel(m)+" -- All Transactions",rows:[...d.incRows.map(i=>({...i,desc:i.customer+" ("+i.jobType+")",payee:""})),...d.expRows]})}>
                        <td style={{...S.td,fontWeight:"700"}}>{monthLabel(m)}</td>
                        <td style={{...S.td,color:C.teal}}>{fmt(d.inc)}</td>
                        <td style={{...S.td,color:C.red}}>{fmt(exp)}</td>
                        <td style={{...S.td,fontWeight:"700",color:net>=0?C.teal:C.red}}>{net>=0?"+":""}{fmt(net)}</td>
                      </tr>
                    );
                  })}
                  {months.length>1&&(()=>{const totExp=months.reduce((s,[,d])=>s+d.expRows.reduce((ss,e)=>ss+e.amount,0),0);const totNet=totalInc-totExp;return(
                    <tr style={{borderTop:`2px solid ${C.border}`,background:C.faint}}>
                      <td style={{...S.td,fontWeight:"700",fontSize:"11px",color:C.muted}}>TOTAL</td>
                      <td style={{...S.td,fontWeight:"700",color:C.teal}}>{fmt(totalInc)}</td>
                      <td style={{...S.td,fontWeight:"700",color:C.red}}>{fmt(totExp)}</td>
                      <td style={{...S.td,fontWeight:"700",color:totNet>=0?C.teal:C.red,fontSize:"14px"}}>{totNet>=0?"+":""}{fmt(totNet)}</td>
                    </tr>
                  );})()}
                </tbody></table></div>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"24px",marginBottom:"8px",borderBottom:`1px solid ${C.border}`,paddingBottom:"6px"}}>
                  <span style={{fontSize:"10px",color:C.muted,letterSpacing:"3px",textTransform:"uppercase"}}>Schedule C -- click any category to see transactions</span>
                  <button onClick={()=>downloadCSV(
                      ["Tax Category","Deductible","Gross","Business Use %","Transactions"],
                      taxRows.map(([cat,rows])=>{
                        const gross=rows.reduce((s,e)=>s+e.amount,0), ded=taxSum(rows);
                        return [cat,ded.toFixed(2),gross.toFixed(2),(gross?ded/gross*100:100).toFixed(1),rows.length];
                      }).concat([["TOTAL DEDUCTIBLE",totalDed.toFixed(2),"","",""]]),
                      "schedule_c.csv")}
                    style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px",color:C.teal,borderColor:C.teal+"44"}}>Schedule C CSV</button>
                </div>
                <div style={S.card}>
                  <div style={{padding:"10px 12px",background:C.bg,borderRadius:"7px",marginBottom:"14px",fontSize:"11px",color:C.muted}}>
                    📋 Deductible expenses only. Loan principal excluded.
                    {use&&<> Truck costs are shown at <strong style={{color:C.orange}}>{(usePct*100).toFixed(1)}%</strong> business use, not their full amount.</>}
                  </div>
                  {mileageCatUsed&&(
                    <div style={{padding:"10px 12px",background:C.yellowD,border:`1px solid ${C.yellow}44`,borderRadius:"7px",marginBottom:"14px",fontSize:"11px",color:C.yellow}}>
                      ⚠️ Some expenses use the "Mileage" category. Claiming the standard mileage rate and the truck's running costs are alternatives -- using both for the same vehicle would double-count.
                    </div>
                  )}
                  <table style={S.tbl}><thead><tr>{["Tax Category","Amount",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                    {taxRows.length===0&&<tr><td colSpan={3} style={{...S.td,textAlign:"center",color:C.muted,padding:"24px"}}>No deductible expenses</td></tr>}
                    {taxRows.map(([cat,rows])=>{
                      const amt=taxSum(rows);
                      const gross=rows.reduce((s,e)=>s+e.amount,0);
                      const scaled=Math.abs(gross-amt)>0.005;
                      return(
                        <tr key={cat} className="hrow" style={{cursor:"pointer"}} onClick={()=>setDrillData({title:`Schedule C -- ${cat}`,rows})}>
                          <td style={S.td}>{cat}</td>
                          <td style={{...S.td,fontWeight:"700",color:C.orange}}>
                            {fmt(amt)}
                            {scaled&&<span style={{fontSize:"10px",color:C.muted,fontWeight:"400"}}> of {fmt(gross)}</span>}
                          </td>
                          <td style={{...S.td,color:C.muted,fontSize:"11px"}}>↗ {rows.length} transactions</td>
                        </tr>
                      );
                    })}
                    {taxRows.length>0&&<tr style={{borderTop:`2px solid ${C.border}`}}><td style={{...S.td,fontWeight:"700"}}>TOTAL DEDUCTIBLE</td><td style={{...S.td,fontWeight:"700",color:C.teal,fontSize:"15px"}}>{fmt(totalDed)}</td><td style={S.td}/></tr>}
                  </tbody></table>
                </div>

                {/* Vehicle use -- where the percentage above comes from */}
                {use&&(<>
                  <div style={S.sh}>Vehicle Use</div>
                  <div style={S.g4}>
                    {[["Total Miles",use.total.toFixed(0)+" mi",C.blue,use.fromOdometer?"from the odometer":"from logged trips"],
                      ["Business Miles",use.business.toFixed(0)+" mi",C.teal,rTrips.length+" trips logged"],
                      ["Personal Miles",use.personal.toFixed(0)+" mi",C.muted,use.personal>0?"excluded":"none logged"],
                      ["Business Use",(use.pct*100).toFixed(1)+"%",C.orange,"applied to truck costs"]
                    ].map(([l,v,col,sub])=>(
                      <div key={l} style={S.card}>
                        <div style={S.sl}>{l}</div>
                        <div style={{fontSize:"18px",fontWeight:"700",color:col,marginTop:"4px"}}>{v}</div>
                        <div style={{fontSize:"10px",color:C.muted,marginTop:"2px"}}>{sub}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{...S.card,marginTop:"12px"}}>
                    <table style={S.tbl}><tbody>
                      <tr><td style={{...S.td,color:C.muted,fontSize:"12px"}}>Truck running costs in this period</td>
                          <td style={{...S.td,textAlign:"right",fontWeight:"700"}}>{fmt(vehicleGross)}</td></tr>
                      <tr><td style={{...S.td,color:C.muted,fontSize:"12px"}}>Business share at {(use.pct*100).toFixed(1)}%</td>
                          <td style={{...S.td,textAlign:"right",fontWeight:"700",color:C.teal}}>{fmt(vehicleNet)}</td></tr>
                      <tr style={{borderTop:`1px solid ${C.border}`}}>
                          <td style={{...S.td,color:C.muted,fontSize:"12px"}}>Not deductible (personal use)</td>
                          <td style={{...S.td,textAlign:"right",fontWeight:"700",color:C.red}}>{fmt(vehicleGross-vehicleNet)}</td></tr>
                    </tbody></table>
                    <div style={{fontSize:"11px",color:C.muted,marginTop:"10px",lineHeight:1.6}}>
                      Covers {VEHICLE_CATS.join(", ")}. Tolls and parking are deductible in full and aren't scaled.
                    </div>
                  </div>

                  {use.unlogged>0&&(
                    <div style={{padding:"10px 12px",background:C.yellowD,border:`1px solid ${C.yellow}44`,borderRadius:"8px",marginTop:"10px",fontSize:"11px",color:C.yellow,lineHeight:1.6}}>
                      ⚠️ The odometer moved {use.total.toFixed(0)} miles but only {use.logged.toFixed(0)} are logged, leaving <strong>{use.unlogged.toFixed(0)} miles unaccounted</strong>. They're treated as non-business, which is what drops the share to {(use.pct*100).toFixed(1)}%. Logging them as trips would raise it.
                    </div>
                  )}
                  {!use.fromOdometer&&(
                    <div style={{padding:"10px 12px",background:C.yellowD,border:`1px solid ${C.yellow}44`,borderRadius:"8px",marginTop:"10px",fontSize:"11px",color:C.yellow,lineHeight:1.6}}>
                      ⚠️ Odometer readings are missing or inconsistent for this period, so total miles fall back to the sum of logged trips. That can overstate business use, because unlogged driving isn't counted.
                    </div>
                  )}
                  <button onClick={()=>exportCSV("mileage")} style={{...S.bgh,flex:"none",padding:"5px 12px",fontSize:"11px",marginTop:"10px"}}>Mileage CSV</button>
                </>)}
                {!use&&(
                  <div style={{padding:"12px",background:C.yellowD,border:`1px solid ${C.yellow}44`,borderRadius:"8px",marginTop:"16px",fontSize:"11px",color:C.yellow,lineHeight:1.6}}>
                    ⚠️ No trips logged in this period, so truck costs are shown at their full amount. Deducting them normally requires mileage records supporting the business-use share.
                  </div>
                )}
              </>);
            })()}

          </>
          );
        })()}

        {/* ==================================================================
            SETTINGS
        ================================================================== */}
        {view==="settings"&&(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
              <div style={{fontSize:"18px",fontWeight:"700"}}>Settings &amp; Data</div>
            </div>

            {/* -- API KEY -- */}
            <div style={{...S.card,marginBottom:"16px"}}>
              <div style={{fontWeight:"700",fontSize:"13px",marginBottom:"10px"}}>🔑 Anthropic API Key (Receipt Scanning)</div>
              {anthropicKey?(
                <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
                  <span style={{fontSize:"12px",color:C.teal}}>✓ Key saved</span>
                  <span style={{fontSize:"12px",color:C.muted,fontFamily:"monospace"}}>{anthropicKey.slice(0,16)}•••</span>
                  <button style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"11px"}} onClick={()=>{localStorage.removeItem("hb_anthropic_key");setAnthropicKey("");setKeyInput("");}}>Remove</button>
                </div>
              ):(
                <div style={{display:"flex",gap:"8px",flexDirection:isMobile?"column":"row"}}>
                  <input style={{...S.inp,flex:1,fontFamily:"monospace",fontSize:"12px"}} placeholder="sk-ant-api03-..." value={keyInput} onChange={e=>setKeyInput(e.target.value)} type="password"/>
                  <button style={{...S.btn,flex:"none"}} onClick={()=>{if(keyInput.trim()){localStorage.setItem("hb_anthropic_key",keyInput.trim());setAnthropicKey(keyInput.trim());setKeyInput("");}}} >Save Key</button>
                </div>
              )}
              <div style={{fontSize:"11px",color:C.muted,marginTop:"8px"}}>Stored locally on this device only. Never sent to anyone except Anthropic.</div>
            </div>

            {/* -- BUSINESS DETAILS (used on customer receipts) -- */}
            <div style={{...S.card,marginBottom:"16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px",flexWrap:"wrap",gap:"8px"}}>
                <div><div style={{fontWeight:"700",fontSize:"13px"}}>🧾 Business Details</div><div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>Printed on customer receipts. The logo already carries the tagline.</div></div>
                {!bizForm&&<button style={{...S.bgh,flex:"none",padding:"5px 12px",fontSize:"11px",color:C.blue,borderColor:C.blue+"44"}} onClick={()=>setBizForm({...biz})}>Edit</button>}
              </div>
              <div style={{background:"#000",borderRadius:"8px",padding:"12px",marginBottom:"12px",textAlign:"center"}}>
                <img src={LOGO_DATA_URI} alt="Mon Valley Hauling & Services" style={{width:"100%",maxWidth:"340px",display:"inline-block"}}/>
              </div>
              {!bizForm?(
                <div style={{fontSize:"12px",color:C.muted,lineHeight:1.8}}>
                  <div style={{color:C.text,fontWeight:"600"}}>{biz.name}</div>
                  {biz.address&&<div style={{whiteSpace:"pre-line"}}>{biz.address}</div>}
                  {biz.phone?<div>{fmtPhone(biz.phone)}</div>:<div style={{color:C.yellow}}>No phone set — it won't appear on receipts</div>}
                  {biz.email?<div>{biz.email}</div>:<div style={{color:C.yellow}}>No email set — it won't appear on receipts</div>}
                </div>
              ):(
                <>
                  <label style={S.lbl}>Business Name</label>
                  <input style={S.inp} value={bizForm.name} onChange={e=>setBizForm(f=>({...f,name:e.target.value}))}/>
                  <div style={S.row}>
                    <div style={{flex:1}}><label style={S.lbl}>Phone</label><input style={S.inp} placeholder="724-555-0000" value={bizForm.phone} onChange={e=>setBizForm(f=>({...f,phone:e.target.value}))}/></div>
                    <div style={{flex:1}}><label style={S.lbl}>Email</label><input style={S.inp} placeholder="you@example.com" value={bizForm.email} onChange={e=>setBizForm(f=>({...f,email:e.target.value}))}/></div>
                  </div>
                  <label style={S.lbl}>Address</label>
                  <input style={S.inp} placeholder="Street, City, State ZIP" value={bizForm.address} onChange={e=>setBizForm(f=>({...f,address:e.target.value}))}/>
                  <label style={S.lbl}>Receipt footer note</label>
                  <input style={S.inp} value={bizForm.footerNote} onChange={e=>setBizForm(f=>({...f,footerNote:e.target.value}))}/>
                  <div style={S.br}>
                    <button style={S.btn} onClick={saveBiz}>Save</button>
                    <button style={S.bgh} onClick={()=>setBizForm(null)}>Cancel</button>
                  </div>
                </>
              )}
            </div>

            {/* -- ALL EXPENSES TABLE -- */}
            <div style={S.sh}>All Expenses</div>
            {(()=>{
              const filtered = expenses.filter(e=>{
                if(!inDateRange(e.date,allExpDate)) return false;
                if(allExpType&&e.type!==allExpType) return false;
                if(allExpPayee&&e.payee!==allExpPayee) return false;
                if(allExpCat&&e.category!==allExpCat) return false;
                if(allExpSearch){
                  const q=allExpSearch.toLowerCase();
                  if(!e.desc.toLowerCase().includes(q)&&!(e.payee||"").toLowerCase().includes(q)&&!(e.notes||"").toLowerCase().includes(q)) return false;
                }
                return true;
              }).sort((a,b)=>b.date.localeCompare(a.date));
              const total = filtered.reduce((s,e)=>s+e.amount,0);
              const allPayees = [...new Set(expenses.map(e=>e.payee).filter(Boolean))].sort();
              const allCats = [...new Set(expenses.map(e=>e.category).filter(Boolean))].sort();
              const hasFilter = allExpSearch||allExpPayee||allExpCat||allExpType||allExpDate.year!=="all";
              return (
                <>
                  <div style={{display:"flex",flexDirection:"column",gap:"8px",marginBottom:"14px"}}>
                    <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
                      <DateFilter f={allExpDate} setF={setAllExpDate}/>
                      <span style={{fontSize:"11px",color:C.muted,marginLeft:"auto"}}>{filtered.length} of {expenses.length} · {fmt(total)}</span>
                    </div>
                    <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                      <div style={{position:"relative",flex:"2",minWidth:"160px"}}>
                        <input style={{...S.inp,paddingLeft:"26px"}} placeholder="Search description, payee, notes..." value={allExpSearch} onChange={e=>setAllExpSearch(e.target.value)}/>
                        <span style={{position:"absolute",left:"8px",top:"50%",transform:"translateY(-50%)",color:C.muted,fontSize:"13px",pointerEvents:"none"}}>🔍</span>
                        {allExpSearch&&<button onClick={()=>setAllExpSearch("")} style={{position:"absolute",right:"8px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"16px",lineHeight:1}}>×</button>}
                      </div>
                      <select style={{...S.sel,flex:"1",minWidth:"130px"}} value={allExpPayee} onChange={e=>setAllExpPayee(e.target.value)}>
                        <option value="">All Payees</option>
                        {allPayees.map(p=><option key={p} value={p}>{p}</option>)}
                      </select>
                      <select style={{...S.sel,flex:"1",minWidth:"130px"}} value={allExpCat} onChange={e=>setAllExpCat(e.target.value)}>
                        <option value="">All Categories</option>
                        {allCats.map(c=><option key={c} value={c}>{c}</option>)}
                      </select>
                      {hasFilter&&<button style={{...S.bgh,flex:"none",padding:"6px 10px",fontSize:"11px",color:C.red,borderColor:C.red+"44"}} onClick={()=>{setAllExpSearch("");setAllExpPayee("");setAllExpCat("");setAllExpType("");setAllExpDate(makeFilter("all"));}}>Clear</button>}
                    </div>
                  </div>
                  <div style={S.card}>
                    <table style={S.tbl}><thead><tr>{["Date","Description","Category","Payee","Amount",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                      {filtered.length===0&&<tr><td colSpan={6} style={{...S.td,textAlign:"center",color:C.muted,padding:"32px"}}>No expenses match filters</td></tr>}
                      {filtered.map(e=>{
                        return(
                          <tr key={e.id} className="hrow" style={{cursor:"pointer"}} onClick={()=>{openViewExpense(e);}}>
                            <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(e.date)}</td>
                            <td style={S.td}><div style={{display:"flex",alignItems:"center",gap:"5px"}}>{hasReceipt(e)&&<span>🧾</span>}<div><div>{e.desc}</div>{e.notes&&<div style={{fontSize:"11px",color:C.muted}}>{e.notes}</div>}</div></div></td>
                            <td style={S.td}><span style={S.badge(C.blue)}>{e.category}</span></td>
                            <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{e.payee||"--"}</td>
                            <td style={{...S.td,fontWeight:"700"}}>{fmt(e.amount)}</td>
                            <td style={S.td} onClick={ev=>ev.stopPropagation()}><button onClick={()=>deleteExpense(e.id)} style={S.xBtn}>×</button></td>
                          </tr>
                        );
                      })}
                      {filtered.length>0&&<tr style={{borderTop:`2px solid ${C.border}`}}><td colSpan={4} style={{...S.td,fontWeight:"700",color:C.muted,fontSize:"11px"}}>TOTAL ({filtered.length})</td><td style={{...S.td,fontWeight:"700",fontSize:"14px"}}>{fmt(total)}</td><td style={S.td}/></tr>}
                    </tbody></table>
                  </div>
                </>
              );
            })()}

            <div style={S.sh}>Vendors &amp; Payees</div>
            <div style={S.card}>
              <div style={{fontSize:"12px",color:C.muted,marginBottom:"14px"}}>Used in the Payee dropdown when logging expenses.</div>
              <div style={{display:"flex",gap:"8px",marginBottom:"16px"}}>
                <input style={{...S.inp,flex:1}} placeholder="Add new vendor..." id="newVendorInput"
                  onKeyDown={e=>{if(e.key==="Enter"&&e.target.value.trim()){addVendor(e.target.value.trim());e.target.value="";}}}/>
                <button style={{...S.btn,flex:"none",padding:"8px 16px",fontSize:"12px"}} onClick={()=>{const el=document.getElementById("newVendorInput");if(el&&el.value.trim()){addVendor(el.value.trim());el.value="";}}}>Add</button>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
                {vendors.sort((a,b)=>a.localeCompare(b)).map(v=>(
                  <div key={v} style={{display:"flex",alignItems:"center",gap:"4px",padding:"4px 8px 4px 10px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:"20px",fontSize:"12px"}}>
                    <span>{v}</span>
                    <button onClick={()=>setVendors(p=>p.filter(x=>x!==v))} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"14px",lineHeight:1,padding:"0 0 0 4px"}}>×</button>
                  </div>
                ))}
              </div>
            </div>

          </>
        )}

      </main>

      {/* ── MOBILE BOTTOM NAV ── */}
      {isMobile&&(
        <nav style={{position:"fixed",bottom:0,left:0,right:0,background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
          {[
            ["dashboard","📊","Dash",C.blue],
            ["hauling","🚛","Hauling",C.orange],
            ["reports","📈","Reports",C.yellow],
          ].map(([v,icon,label,col])=>(
            <button key={v} onClick={()=>setView(v)} style={{flex:1,padding:"10px 4px 8px",border:"none",background:"transparent",color:view===v?col:C.muted,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",fontSize:"18px",transition:"color 0.1s"}}>
              <span>{icon}</span>
              <span style={{fontSize:"9px",fontWeight:"700",letterSpacing:"0.5px",textTransform:"uppercase"}}>{label}</span>
              {view===v&&<span style={{width:"20px",height:"2px",background:col,borderRadius:"1px"}}/>}
            </button>
          ))}
        </nav>
      )}

      {/* ── MOBILE FAB ── */}
      {isMobile&&modal===null&&(
        <button
          onClick={()=>setModal("quicklog")}
          style={{position:"fixed",bottom:"72px",right:"16px",width:"52px",height:"52px",borderRadius:"50%",background:C.orange,border:"none",color:"#fff",fontSize:"26px",fontWeight:"700",cursor:"pointer",zIndex:99,boxShadow:"0 4px 16px rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}
        >＋</button>
      )}

      {/* ── QUICK LOG MODAL (mobile FAB) ── */}
      {modal==="quicklog"&&(
        <div style={S.modal}>
          <div style={{...S.mbox,maxWidth:"100%"}}>
            <div style={{width:"36px",height:"4px",background:C.border,borderRadius:"2px",margin:"0 auto 20px"}}/>
            <div style={{fontSize:"14px",fontWeight:"700",marginBottom:"16px",letterSpacing:"1px",textTransform:"uppercase",color:C.muted}}>Quick Log</div>
            <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
              <button style={{...S.btn,background:C.teal,padding:"14px",fontSize:"14px",borderRadius:"10px",textAlign:"left",display:"flex",alignItems:"center",gap:"12px"}}
                onClick={()=>{setJobForm(blankJob);setEditingId(null);setModal("job");}}>
                <span style={{fontSize:"22px"}}>🚛</span><div><div>Hauling Job</div><div style={{fontSize:"11px",fontWeight:"400",opacity:0.8}}>Junk removal, estate cleanout</div></div>
              </button>
              <button style={{...S.btn,background:C.blue,padding:"14px",fontSize:"14px",borderRadius:"10px",textAlign:"left",display:"flex",alignItems:"center",gap:"12px"}}
                onClick={()=>{setExpForm(blankExp);setReceiptState("idle");setReceiptData(null);setReceiptMode("scan");setExpModalContext(null);setEditingId(null);setModal("expense");}}>
                <span style={{fontSize:"22px"}}>🧾</span><div><div>Expense</div><div style={{fontSize:"11px",fontWeight:"400",opacity:0.8}}>Fuel, dump fees, supplies, etc.</div></div>
              </button>
              <button style={{...S.btn,background:C.purple,padding:"14px",fontSize:"14px",borderRadius:"10px",textAlign:"left",display:"flex",alignItems:"center",gap:"12px"}}
                onClick={()=>{setTripForm(blankTrip);setEditingId(null);setModal("trip");}}>
                <span style={{fontSize:"22px"}}>🛣</span><div><div>Log Mileage</div><div style={{fontSize:"11px",fontWeight:"400",opacity:0.8}}>Business trip or delivery</div></div>
              </button>
            </div>
            <button style={{...S.bgh,marginTop:"12px",padding:"12px",fontSize:"13px"}} onClick={()=>setModal(null)}>Cancel</button>
          </div>
        </div>
      )}

      {/* ====================================================================
          MODALS
      ==================================================================== */}

      {/* Hidden file inputs for receipt scan */}
      <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={handleFileInput}/>
      <input ref={cameraRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleFileInput}/>
      <input ref={stmtRef} type="file" accept=".csv,text/csv,text/plain" style={{display:"none"}} onChange={handleStatementInput}/>

      {/* -- VIEW EXPENSE -- */}
      {modal==="viewExpense"&&viewingExpense&&(()=>{
        const e=viewingExpense;
        const imgSrc=e.receiptB64?`data:${e.receiptMediaType||"image/jpeg"};base64,${e.receiptB64}`:e.receiptImg;
        return (
          <div style={S.modal} onClick={ev=>ev.target===ev.currentTarget&&setModal(null)}>
            <div style={{...S.mbox,maxWidth:"480px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"4px"}}>
                <div style={S.mt}>{e.desc}</div>
                <button onClick={()=>setModal(null)} style={S.xBtn}>×</button>
              </div>
              <div style={{marginBottom:"18px"}}>
                <span style={S.badge(C.orange)}>Hauling</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
                {[["Date",fmtDate(e.date)],["Amount",fmt(e.amount)],["Category",e.category],["Payee",e.payee||"--"]].map(([label,val])=>(
                  <div key={label} style={{background:C.bg,borderRadius:"8px",padding:"12px"}}>
                    <div style={{fontSize:"10px",color:C.muted,letterSpacing:"2px",textTransform:"uppercase",marginBottom:"4px"}}>{label}</div>
                    <div style={{fontSize:"14px",fontWeight:"700"}}>{val}</div>
                  </div>
                ))}
              </div>
              {e.notes&&<div style={{background:C.bg,borderRadius:"8px",padding:"12px",marginBottom:"14px"}}><div style={{fontSize:"10px",color:C.muted,letterSpacing:"2px",textTransform:"uppercase",marginBottom:"4px"}}>Notes</div><div style={{fontSize:"13px"}}>{e.notes}</div></div>}
              <div style={{fontSize:"10px",color:C.muted,letterSpacing:"2px",textTransform:"uppercase",marginBottom:"8px"}}>Receipt</div>
