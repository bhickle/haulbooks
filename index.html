// PDF VIEWER
// -----------------------------------------------------------------------------
function PdfViewer({ b64 }) {
  const canvasRef = useRef(null);
  const [numPages, setNumPages] = useState(0);
  const [currentPage, setCurrentPage] = useState(1);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const docRef = useRef(null);
  useEffect(() => {
    if (!b64) return;
    setLoading(true); setError(false);
    const load = async () => {
      try {
        const pdfjsLib = window.pdfjsLib;
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const binary = atob(b64), bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
        docRef.current = doc; setNumPages(doc.numPages); setLoading(false); renderPage(doc, 1);
      } catch(e) { setError(true); setLoading(false); }
    };
    if (window.pdfjsLib) { load(); return; }
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = load; s.onerror = () => { setError(true); setLoading(false); };
    document.head.appendChild(s);
  }, [b64]);
  const renderPage = async (doc, pageNum) => {
    if (!canvasRef.current || !doc) return;
    const page = await doc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = canvasRef.current;
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  };
  const goToPage = (p) => { if (!docRef.current) return; setCurrentPage(p); renderPage(docRef.current, p); };
  if (loading) return <div style={{textAlign:"center",padding:"40px",color:"#7d8590"}}>Loading PDF...</div>;
  if (error) return <div style={{textAlign:"center",padding:"40px",color:"#f85149"}}>Could not render PDF</div>;
  return (
    <div>
      <div style={{overflowX:"auto",borderRadius:"8px",border:"1px solid #21262d",background:"#fff"}}>
        <canvas ref={canvasRef} style={{display:"block",maxWidth:"100%"}} />
      </div>
      {numPages > 1 && (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"12px",marginTop:"8px"}}>
          <button onClick={()=>goToPage(Math.max(1,currentPage-1))} disabled={currentPage===1} style={{padding:"4px 10px",background:"#1c2330",border:"1px solid #21262d",borderRadius:"6px",color:"#e6edf3",cursor:"pointer",fontSize:"12px"}}>←</button>
          <span style={{fontSize:"12px",color:"#7d8590"}}>Page {currentPage} of {numPages}</span>
          <button onClick={()=>goToPage(Math.min(numPages,currentPage+1))} disabled={currentPage===numPages} style={{padding:"4px 10px",background:"#1c2330",border:"1px solid #21262d",borderRadius:"6px",color:"#e6edf3",cursor:"pointer",fontSize:"12px"}}>→</button>
        </div>
      )}
    </div>
  );
}

const PAYMENT_RE = /THANK YOU FOR YOUR PMT|ONLINE CREDIT CARD PMT|AUTOMATIC PAYMENT|PAYMENT\s*-?\s*THANK|AUTOPAY|^\s*PAYMENT\b/i;

const dayGap = (a,b) => Math.round(Math.abs(new Date(a+"T12:00:00") - new Date(b+"T12:00:00"))/86400000);
const stmtDate = (s) => {
  s=(s||"").trim();

  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  return m ? `${m[3]}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}` : "";
};
const stmtAmount = (s) => {
  const raw=String(s==null?"":s).trim();
  const paren=/^\(.*\)$/.test(raw);
  const n=parseFloat(raw.replace(/[^0-9.\-]/g,""));
  if(isNaN(n)) return NaN;
  return paren ? -Math.abs(n) : n;
};

// Minimal RFC-4180 CSV reader (handles quoted fields containing commas/newlines).
function parseCsvText(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"'){ q=true; }
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c!=="\r"){ cur+=c; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}

// Turn raw CSV text into normalized statement lines. Throws on unrecognized files.
function readStatement(text){
  const grid=parseCsvText(text);
  if(grid.length<2) throw new Error("That file has no transactions in it.");
  const head=grid[0].map(h=>h.trim().toLowerCase());
  const find=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const iDate=find("transaction date","trans date","date","posted date");
  const iPost=find("post date","posting date");
  const iDesc=find("description","payee","merchant","name");
  const iAmt =find("amount","debit");
  const iType=find("type","transaction type");
  const iCat =find("category");
  const iCard=find("card","card no.","account");
  if(iDate<0||iDesc<0||iAmt<0) throw new Error("Could not find Date, Description and Amount columns. Export the CSV from your card issuer without changing the headers.");
  const out=[];
  for(let r=1;r<grid.length;r++){
    const g=grid[r];
    const date=stmtDate(g[iDate]); const amount=stmtAmount(g[iAmt]);
    if(!date||isNaN(amount)) continue;
    out.push({
      date, postDate: iPost>=0?stmtDate(g[iPost]):"",
      desc: htmlUnescape((g[iDesc]||"").trim()),
      amount,
      type: iType>=0?(g[iType]||"").trim():"",
      issuerCat: iCat>=0?(g[iCat]||"").trim():"",
      card: iCard>=0?(g[iCard]||"").trim():"",
    });
  }
  if(!out.length) throw new Error("No readable transactions found in that file.");

  // Issuers disagree on which way a purchase points: Chase writes purchases
  // negative and payments positive, PNC does the exact opposite. Guessing wrong
  // would offer the card payments as expenses, so work it out per file. A
  // payment always has the opposite sign to a purchase; if there are none to
  // learn from, fall back to the majority, since most lines are purchases.
  const pays=out.filter(t=>PAYMENT_RE.test(t.desc));
  let purchaseSign=0;
  if(pays.length){
    const s=Math.sign(pays.reduce((a,t)=>a+t.amount,0));
    if(s) purchaseSign=-s;
  }
  if(!purchaseSign){
    const npos=out.filter(t=>t.amount>0).length;
    purchaseSign = npos*2>=out.length ? 1 : -1;
  }
  // Normalise to "a purchase is negative", which is what everything downstream assumes.
  if(purchaseSign>0) out.forEach(t=>{ t.amount = -t.amount; });
  return out;
}

// Stable identity for a statement line. The trailing occurrence index keeps two
// genuinely separate but identical charges (same day, merchant and amount) apart,
// and stays stable across re-downloads because it only counts within its own group.
const fingerprintOf = (t, occurrence) =>
  [t.card||"", t.date, t.postDate||"", normMerchant(t.desc), t.amount.toFixed(2), occurrence].join("|");

// What kind of line is this? Only 'expense' is a real cost.
function classifyLine(t){
  const ty=(t.type||"").toLowerCase();
  // Description first: it's the only signal when the export has no type column.
  // Checked before the type so "Returned Payment" still reads as a reversal.
  if(ty.includes("reversal")) return "reversal";   // negative but NOT a cost
  if(PAYMENT_RE.test(t.desc)) return "payment";    // paying the card off
  if(CREDIT_RE.test(t.desc)) return "credit";      // cash-back / rewards credit
  if(ty.includes("payment")) return "payment";
  if(ty.includes("return")||ty.includes("refund")) return "refund";
  if(t.amount>0) return "credit";
  return "expense";
}

const VendorInput = ({value, onChange, placeholder="e.g. Sheetz, Lowe's", vendors, addVendor}) => {
  const [query, setQuery] = useState(value||"");
  const [open, setOpen] = useState(false);
  const [highlightIdx, setHighlightIdx] = useState(0);
  useEffect(()=>{ setQuery(value||""); },[value]);
  const matches = query.length>0 ? vendors.filter(v=>v.toLowerCase().includes(query.toLowerCase())).slice(0,8) : vendors.slice(0,8);
  const showAddNew = query.trim().length>0 && !vendors.find(v=>v.toLowerCase()===query.trim().toLowerCase());
  const select=(name)=>{const added=addVendor(name);setQuery(added);onChange(added);setOpen(false);};
  const handleKey=(e)=>{
    const total=matches.length+(showAddNew?1:0);
    if(e.key==="ArrowDown"){e.preventDefault();setHighlightIdx(i=>Math.min(i+1,total-1));}
    else if(e.key==="ArrowUp"){e.preventDefault();setHighlightIdx(i=>Math.max(i-1,0));}
    else if(e.key==="Enter"){e.preventDefault();if(highlightIdx<matches.length)select(matches[highlightIdx]);else if(showAddNew)select(query.trim());}
    else if(e.key==="Escape"){setOpen(false);}
  };
  const inpStyle={width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,padding:"9px 12px",fontSize:"14px",boxSizing:"border-box",fontFamily:"inherit",transition:"border-color 0.15s"};
  return (
    <div style={{position:"relative"}}>
      <input style={inpStyle} placeholder={placeholder} value={query} autoComplete="off"
        onChange={e=>{setQuery(e.target.value);onChange(e.target.value);setOpen(true);setHighlightIdx(0);}}
        onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)} onKeyDown={handleKey}/>
      {open&&(matches.length>0||showAddNew)&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,background:C.surface,border:`1px solid ${C.border}`,borderRadius:"7px",zIndex:300,maxHeight:"200px",overflowY:"auto",marginTop:"2px",boxShadow:"0 4px 16px rgba(0,0,0,0.4)"}}>
          {matches.map((v,i)=>(
            <div key={v} onMouseDown={()=>select(v)} style={{padding:"8px 12px",cursor:"pointer",background:i===highlightIdx?C.faint:"transparent",fontSize:"13px",borderBottom:`1px solid ${C.faint}`}}>{v}</div>
          ))}
          {showAddNew&&(
            <div onMouseDown={()=>select(query.trim())} style={{padding:"8px 12px",cursor:"pointer",background:highlightIdx===matches.length?C.faint:"transparent",fontSize:"13px",color:C.teal,borderTop:matches.length>0?`1px solid ${C.border}`:"none",display:"flex",alignItems:"center",gap:"6px"}}>

};

  // -- Load all data from Supabase on mount
  useEffect(()=>{

  const haulingNetProfit = useMemo(()=>totalHaulingInc-totalHaulingExp,[totalHaulingInc,totalHaulingExp]);

  const taxSummary = useMemo(()=>{const map={};haulingExpenses.filter(e=>e.category!=="Loan Payment (Principal)").forEach(e=>{const k=TAX_MAP[e.category]||"Miscellaneous";map[k]=(map[k]||0)+e.amount;});return Object.entries(map).sort((a,b)=>b[1]-a[1]);},[haulingExpenses]);

  // -- Handlers --------------------------------------------------------------
  const toBase64=(file)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("fail"));r.readAsDataURL(file);});

  const scanReceipt=async(file)=>{
    setReceiptState("scanning");setScanError("");
    try{
      const b64=await toBase64(file);const isPdf=file.type==="application/pdf";const mediaType=isPdf?"application/pdf":(file.type||"image/jpeg");
      const PROMPT=`Receipt parser for Mon Valley Hauling & Services. Return ONLY valid JSON:\n{"date":"YYYY-MM-DD","vendor":"name","amount":number,"description":"1-line","category":"one of: ${ALL_CATS.join(",")}","notes":"detail","confidence":"high|medium|low"}\nRules: gas/diesel→Fuel, auto parts→Truck Maintenance, landfill/dump→Dump Fees, labor help→Contract Labor, tools→Tools & Equipment`;
      const fileBlock=isPdf?{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}}:{type:"image",source:{type:"base64",media_type:mediaType,data:b64}};
      const key=localStorage.getItem("hb_anthropic_key")||"";
      if(!key)throw new Error("No API key set. Add your Anthropic API key in Settings.");
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,messages:[{role:"user",content:[fileBlock,{type:"text",text:PROMPT}]}]})});
      if(!resp.ok){const e=await resp.text();throw new Error(`${resp.status}: ${e}`);}
      const data=await resp.json();if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
      const text=data.content?.find(b=>b.type==="text")?.text||"{}";
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      const fullData={...parsed,b64,mediaType,isPdf,fileName:file.name};
      setReceiptData(fullData);applyReceiptData(fullData,scanTarget);setReceiptState("review");
    }catch(err){console.error("Receipt scan error:",err);setScanError(err.message||"Receipt scan failed.");setReceiptState("error");}
  };
  const handleFileInput=(e)=>{const file=e.target.files?.[0];if(file)scanReceipt(file);};
  const applyReceiptData=useCallback((data,target)=>{
    if(!data)return;
    if(data.vendor)addVendor(data.vendor);
    setExpForm(f=>({...f,date:data.date||tod(),desc:data.description||"",amount:data.amount||"",category:data.category||"Fuel",payee:data.vendor||"",notes:data.notes||"",receiptB64:data.b64||null,receiptMediaType:data.mediaType||null,receiptIsPdf:data.isPdf||false,receiptFileName:data.fileName||null,type:"business"}));
  },[scanTarget,vendors]);

  // -- Statement import ------------------------------------------------------
  // Turn parsed statement lines into reviewable rows: suggest a payee/category,
  // work out what each line is, and flag anything already in the books.
  const buildImportRows = useCallback((lines)=>{
    // What category has each payee historically been given?
    const counts={}, display={};
    expenses.forEach(e=>{
      const k=normMerchant(e.payee); if(!k) return;
      counts[k]=counts[k]||{}; counts[k][e.category]=(counts[k][e.category]||0)+1;
      if(!display[k]) display[k]=e.payee;
    });
    const best={};
    Object.keys(counts).forEach(k=>{
      const sorted=Object.entries(counts[k]).sort((a,b)=>b[1]-a[1]);
      // If a payee is split across categories (Xfinity: Internet vs Phone) don't guess.
      best[k]= sorted.length>1 && sorted[0][1]===sorted[1][1] ? "" : sorted[0][0];
    });
    // Existing expenses indexed by amount so a charge can also be matched to an
    // entry logged a day or two off. That happens constantly: a receipt gets
    // entered on the day it was pumped while the card dates it the next day, and
    // an exact-date-only check silently lets those through as duplicates.
    const byAmount={};
    expenses.forEach(e=>{
      const a=Math.abs(Number(e.amount)).toFixed(2);
      (byAmount[a]=byAmount[a]||[]).push({date:e.date,used:false});
    });
    // Claim the closest unused entry of this amount within maxDays. Returns the
    // gap in days, or null if there's nothing to match.
    const claim=(amt,date,maxDays)=>{
      const list=byAmount[amt]; if(!list) return null;
      let best=null;
      list.forEach(x=>{
        if(x.used) return;
        const g=dayGap(x.date,date);
        if(g<=maxDays&&(best===null||g<best.g)) best={x,g};
      });
      if(!best) return null;
      best.x.used=true; return best.g;
    };

    const seen={};
    return lines.map(t=>{
      const norm=normMerchant(t.desc);
      const groupKey=[t.card||"",t.date,t.postDate||"",norm,t.amount.toFixed(2)].join("|");
      const occ=(seen[groupKey]=(seen[groupKey]||0)+1)-1;
      const fp=fingerprintOf(t,occ);
      const kind=classifyLine(t);

      let payee="", category="", why="";
      const rule=MERCHANT_RULES.find(r=>r[0].test(norm));
      if(rule){ payee=rule[1]; category=rule[2]; why="known merchant"; }
      if(!category){
        const hit=Object.keys(best).find(k=>k.length>2&&(norm===k||norm.indexOf(k)>=0||k.indexOf(norm)>=0));
        if(hit){ payee=payee||display[hit]; category=best[hit]; if(category) why="matches your history"; }
      }
      if(!category&&ISSUER_CAT_MAP[t.issuerCat]){ category=ISSUER_CAT_MAP[t.issuerCat]; why="issuer category"; }
      if(!payee) payee=prettyMerchant(t.desc);

      let status="new", note="", include=(kind==="expense");
      if(kind==="payment"){ status="payment"; note="Card payment, not an expense"; include=false; }
      else if(kind==="reversal"){ status="reversal"; note="Reversed payment, not an expense"; include=false; }
      else if(kind==="refund"||kind==="credit"){ status="refund"; note="Refund - include to subtract it"; include=false; }
      else {
        const amt=Math.abs(t.amount).toFixed(2);
        const near=claim(amt,t.date,3);   // 0 = same day, 1-3 = logged a few days off
        if(near===0){ status="logged"; note="Already in your expenses"; include=false; }
        else if(near!==null){
          status="maybedup";
          note=`Same amount already logged ${near} day${near===1?"":"s"} away - check before ticking`;
          include=false;
        }
        // Nothing we could categorise -- often a personal charge. Left unticked
        // so it can never be swept into the books without a deliberate choice.
        else if(!category){ status="needcat"; note="Unrecognised - tick and categorise if it's a business cost"; include=false; }
      }
      const handled=ledger.has(fp);
      if(handled){ status="handled"; note="Imported or excluded previously"; include=false; }
      return {fp,date:t.date,postDate:t.postDate,desc:t.desc,card:t.card,type:t.type,
              amount:Math.abs(t.amount),signed:t.amount,kind,payee,category,why,status,note,include,handled};
    });
  },[expenses,ledger]);

  const loadStatement=async(file)=>{
    setImportErr(""); setImportResult(null); setImportFile(file.name); setShowHandled(false);
    try{
      const rows=buildImportRows(readStatement(await file.text()));
      setImportRows(rows);
      setImportSkipped(rows.filter(r=>r.handled).length);
      setImportState("review");
    }catch(err){
      console.error("Statement import:",err);
      setImportRows([]); setImportErr(err.message||"Could not read that file."); setImportState("review");
    }
  };
  const handleStatementInput=(e)=>{const f=e.target.files&&e.target.files[0]; if(f)loadStatement(f); e.target.value="";};
  const setImportRow=(fp,patch)=>setImportRows(p=>p.map(r=>r.fp===fp?{...r,...patch}:r));

  const runImport=async()=>{
    const chosen=importRows.filter(r=>r.include);
    setImportState("saving"); setImportErr("");
    const stamp=Date.now(); const fpToId={};
    const newExps=chosen.map((r,i)=>{
      const id="imp_"+stamp+"_"+i; fpToId[r.fp]=id;
      const signed=(r.kind==="refund"||r.kind==="credit")?-Math.abs(r.amount):Math.abs(r.amount);
      return {id,date:r.date,desc:r.desc,category:r.category||"Other Business",type:"business",
              flipId:null,propertyId:null,amount:signed,payee:r.payee||"",
              notes:"Imported from card statement",receiptImg:null,receiptB64:null,
              receiptMediaType:null,receiptIsPdf:false,receiptFileName:null};
    });
    try{
      if(newExps.length) await sb.upsert("expenses",newExps.map(fromExpense));
      // Record every line we showed, so re-importing this statement is a no-op.
      // Rows already in the ledger are left alone unless deliberately re-included.
      const toRecord=importRows.filter(r=>!r.handled||r.include).map(r=>({
        fingerprint:r.fp,card:r.card,date:r.date,postDate:r.postDate,desc:r.desc,
        amount:r.signed,type:r.type,decision:r.include?"imported":"skipped",
        skipReason:r.include?null:(r.note||"excluded by user"),expenseId:fpToId[r.fp]||null}));
      if(toRecord.length) await sb.upsert("imported_txns",toRecord.map(fromLedger));
      setExpenses(p=>[...newExps,...p]);
      setLedger(p=>{const n=new Set(p); toRecord.forEach(r=>n.add(r.fingerprint)); return n;});
      chosen.forEach(r=>{ if(r.payee) addVendor(r.payee); });
      setImportResult({added:newExps.length,skipped:toRecord.length-newExps.length,
                       total:newExps.reduce((s,e)=>s+e.amount,0)});
      setImportState("done");
    }catch(err){ console.error("Import save:",err); setImportErr(err.message||"Import failed."); setImportState("review"); }
  };
  const closeImport=()=>{setModal(null);setImportState("idle");setImportRows([]);setImportErr("");setImportResult(null);setImportFile("");};

  const deleteExpense=async(id)=>{try{await sb.remove("expenses",id);}catch(e){console.error(e);}setExpenses(p=>p.filter(e=>e.id!==id));};
  const deleteJob=async(id)=>{try{await sb.remove("income",id);}catch(e){console.error(e);}setIncome(p=>p.filter(i=>i.id!==id));};
  const deleteAsset=async(id)=>{try{await sb.remove("assets",id);}catch(e){console.error(e);}setAssets(p=>p.filter(a=>a.id!==id));};
  const deleteTrip=async(id)=>{try{await sb.remove("trips",id);}catch(e){console.error(e);}setTrips(p=>p.filter(t=>t.id!==id));};
  const startEditExpense=(e)=>{setEditingId(e.id);setExpForm({date:e.date,desc:e.desc,category:e.category,type:e.type,flipId:e.flipId||"",propertyId:e.propertyId||"",amount:String(e.amount),payee:e.payee||"",notes:e.notes||"",receiptImg:e.receiptImg||null,receiptB64:e.receiptB64||null,receiptMediaType:e.receiptMediaType||null,receiptIsPdf:e.receiptIsPdf||false,receiptFileName:e.receiptFileName||null});setModal("expense");};
  const startEditJob=(i)=>{setEditingId(i.id);setJobForm({date:i.date,customer:i.customer,phone:i.phone||"",address:i.address||"",jobType:i.jobType,amount:String(i.amount),paymentMethod:i.paymentMethod,notes:i.notes||""});setModal("job");};
  const startEditAsset=(a)=>{setEditingId(a.id);setAssetForm({date:a.date,name:a.name,vendor:a.vendor||"",cost:String(a.cost),notes:a.notes||""});setModal("asset");};
  const startEditTrip=(t)=>{setEditingId(t.id);setTripForm({date:t.date,desc:t.desc,startOdometer:t.startOdometer||"",endOdometer:t.endOdometer||"",miles:String(t.miles),purpose:t.purpose||"Business",notes:t.notes||""});setModal("trip");};

  // -- LEADS CRUD --
  const saveLead=async()=>{
    if(!leadForm.customer)return;

          const haulingThisMonth = haulingIncome.filter(i=>i.date.startsWith(thisMonth)).reduce((s,i)=>s+i.amount,0);
          const haulingLastMonth = haulingIncome.filter(i=>i.date.startsWith(lastMonth)).reduce((s,i)=>s+i.amount,0);

                ))}

                {haulingTab==="assets"&&<button style={{...S.btn,flex:"none",background:C.yellow,padding:"6px 14px",fontSize:"11px"}} onClick={()=>{setAssetForm(blankAsset);setEditingId(null);setModal("asset");}}>+ Add Asset</button>}
              </div>}
            </div>

            {/* -- LEADS TAB -- */}
            {haulingTab==="leads"&&(()=>{
              const LEAD_STATUSES=[["new","New",C.blue],["estimate_sent","Estimate Sent",C.yellow],["won","Won",C.teal],["lost","Lost",C.red],["complete","Complete",C.muted]];
              const getLeadCol=(s)=>LEAD_STATUSES.find(x=>x[0]===s)?.[2]||C.muted;
              const getLeadLabel=(s)=>LEAD_STATUSES.find(x=>x[0]===s)?.[1]||s;

              const closedLeads=leads.filter(l=>["lost","complete"].includes(l.status));
              const totalEstimated=openLeads.reduce((s,l)=>s+(l.estimatedAmount||0),0);
              const wonLeads=leads.filter(l=>l.status==="won");
              const convRate=leads.filter(l=>l.status!=="new"&&l.status!=="estimate_sent").length>0?Math.round((wonLeads.length/leads.filter(l=>["won","lost"].includes(l.status)).length)*100):null;

                <div style={{marginBottom:"16px",display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>

                </div>
                <div style={S.g3}>
                  {[[`${openLeads.length} Open`,openLeads.length+" leads",C.blue],[`Pipeline Value`,fmt(totalEstimated),C.teal],[`Win Rate`,convRate!==null?convRate+"%":"--",C.orange]].map(([l,v,col])=>(

                          </select>}
                        </div>
                      </div>

                          </div>
                          <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                            <span style={S.badge(getLeadCol(l.status))}>{getLeadLabel(l.status)}</span>
                            {l.estimatedAmount&&<span style={{fontSize:"12px",color:C.muted}}>{fmt(l.estimatedAmount)}</span>}
                            <button onClick={()=>deleteLead(l.id)} style={S.xBtn}>×</button>
                          </div>

                      </div>
                    ))}

            {/* -- SCHEDULED TAB -- */}

              const scheduled=leads.filter(l=>l.scheduledDate&&!["lost","complete"].includes(l.status)).sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));

              return <>
                <div style={{marginBottom:"16px"}}>

                </div>
                <div style={S.g3}>
                  {[[`${upcoming.length} Upcoming`,"jobs",C.blue],[`${past.length} Overdue`,past.length>0?"needs action":"all good",past.length>0?C.red:C.teal],[`This Week`,upcoming.filter(l=>{const d=new Date(l.scheduledDate),n=new Date(today2);return (d-n)/(1000*60*60*24)<=7;}).length+" jobs",C.orange]].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"18px",fontWeight:"700",color:col,marginTop:"4px"}}>{v}</div></div>

                            <div style={{fontWeight:"700",fontSize:"14px"}}>{l.customer}</div>
                            {l.address&&<div style={{fontSize:"11px",color:C.muted}}>📍 {l.address}</div>}
                            {l.phone&&<div style={{fontSize:"11px",color:C.muted}}>📞 {l.phone}</div>}
                            <div style={{display:"flex",gap:"6px",marginTop:"4px",alignItems:"center"}}>
                              <span style={S.badge(C.red)}>Was {fmtDate(l.scheduledDate)}</span>
                              {l.jobType&&<span style={S.badge(C.purple)}>{l.jobType}</span>}
                            </div>
                          </div>
                          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"6px"}}>
                            {l.estimatedAmount&&<div style={{fontWeight:"700",color:C.teal}}>{fmt(l.estimatedAmount)}</div>}
                            <button onClick={()=>convertLeadToJob(l)} style={{...S.btn,background:C.orange,padding:"4px 10px",fontSize:"11px"}}>→ Mark Complete</button>
                            <button onClick={()=>startEditLead(l)} style={{...S.xBtn,color:C.blue,fontSize:"11px",fontWeight:"700"}}>Reschedule</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </>}

                  {upcoming.length>0&&<div style={{fontSize:"11px",fontWeight:"700",color:C.blue,textTransform:"uppercase",letterSpacing:"0.08em",marginTop:"4px"}}>Upcoming</div>}
                  {upcoming.map(l=>{
                    const d=new Date(l.scheduledDate),n=new Date(today2);
                    const daysAway=Math.ceil((d-n)/(1000*60*60*24));

                      <div key={l.id} style={{...S.card,padding:"14px",borderLeft:`3px solid ${C.blue}`}}>

                          <div style={{flex:1}}>
                            <div style={{fontWeight:"700",fontSize:"14px"}}>{l.customer}</div>
                            {l.address&&<div style={{fontSize:"11px",color:C.muted}}>📍 {l.address}</div>}
                            {l.phone&&<div style={{fontSize:"11px",color:C.muted}}>📞 {l.phone}</div>}
                            <div style={{display:"flex",gap:"6px",marginTop:"4px",alignItems:"center"}}>
                              <span style={S.badge(C.blue)}>{fmtDate(l.scheduledDate)}</span>
                              {daysAway===0&&<span style={S.badge(C.orange)}>TODAY</span>}
                              {daysAway===1&&<span style={S.badge(C.yellow)}>TOMORROW</span>}
                              {daysAway>1&&daysAway<=7&&<span style={S.badge(C.yellow)}>in {daysAway}d</span>}

                          </div>
                          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"6px"}}>
                            {l.estimatedAmount&&<div style={{fontWeight:"700",color:C.teal}}>{fmt(l.estimatedAmount)}</div>}
                            <button onClick={()=>convertLeadToJob(l)} style={{...S.btn,background:C.orange,padding:"4px 10px",fontSize:"11px"}}>→ Mark Complete</button>
                            <button onClick={()=>startEditLead(l)} style={{...S.xBtn,color:C.blue,fontSize:"11px",fontWeight:"700"}}>Edit</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>;
            })()}

            {/* -- JOBS TAB -- */}

              const filtered=haulingIncome.filter(i=>inDateRange(i.date,fHaulingJobs)).sort((a,b)=>b.date.localeCompare(a.date));

                  ].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"20px",fontWeight:"700",color:col,marginTop:"4px"}}>{v}</div></div>
                  ))}

                  <div style={{marginTop:"12px",display:"flex",flexDirection:"column",gap:"8px"}}>

                      <div key={i.id} style={{...S.card,padding:"14px",cursor:"pointer",borderLeft:`3px solid ${i.jobType==="Estate Cleanout"?C.purple:C.orange}`}} onClick={()=>{setViewingJob(i);setModal("viewJob");}}>

                          <div style={{fontWeight:"700",fontSize:"14px"}}>{i.customer}</div>
                          <div style={{fontWeight:"700",color:C.teal,fontSize:"15px"}}>{fmt(i.amount)}</div>
                        </div>
                        <div style={{display:"flex",gap:"6px",marginTop:"6px",flexWrap:"wrap",alignItems:"center"}}>
                          <span style={{fontSize:"11px",color:C.muted}}>{fmtDate(i.date)}</span>
                          <span style={S.badge(i.jobType==="Estate Cleanout"?C.purple:C.orange)}>{i.jobType}</span>

                      </div>

                        <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(i.date)}</td>
                        <td style={{...S.td,fontWeight:"600"}}>{i.customer}</td>
                        <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{i.phone||"--"}</td>
                        <td style={S.td}><span style={S.badge(i.jobType==="Estate Cleanout"?C.purple:C.orange)}>{i.jobType}</span></td>
                        <td style={S.td}><span style={S.badge(C.blue)}>{i.paymentMethod}</span></td>
                        <td style={{...S.td,fontWeight:"700",color:C.teal}}>{fmt(i.amount)}</td>
                        <td style={S.td} onClick={ev=>ev.stopPropagation()}><button onClick={()=>deleteJob(i.id)} style={S.xBtn}>×</button></td>
                      </tr>
                    ))}
                    {filtered.length>0&&<tr style={{borderTop:`2px solid ${C.border}`}}><td colSpan={5} style={{...S.td,fontWeight:"700",color:C.muted,fontSize:"11px"}}>TOTAL</td><td style={{...S.td,fontWeight:"700",color:C.teal,fontSize:"15px"}}>{fmt(total)}</td><td style={S.td}/></tr>}
                  </tbody></table></div>
                )}
              </>;
            })()}

            {/* -- EXPENSES TAB -- */}
            {haulingTab==="expenses"&&(()=>{
              const dateFiltered=haulingExpenses.filter(e=>inDateRange(e.date,fHaulingExp));
              const filtered=dateFiltered.filter(e=>{
                if(expSearch&&!e.desc.toLowerCase().includes(expSearch.toLowerCase())&&!(e.payee||"").toLowerCase().includes(expSearch.toLowerCase())&&!(e.notes||"").toLowerCase().includes(expSearch.toLowerCase())) return false;
                if(expFilterPayee&&e.payee!==expFilterPayee) return false;
                if(expFilterCat&&e.category!==expFilterCat) return false;
                return true;
              }).sort((a,b)=>b.date.localeCompare(a.date));
              const total=filtered.reduce((s,e)=>s+e.amount,0);
              const deductible=filtered.filter(e=>e.category!=="Loan Payment (Principal)").reduce((s,e)=>s+e.amount,0);
              return <>
                <div style={{display:"flex",flexDirection:"column",gap:"8px",marginBottom:"16px"}}>
                  {isMobile&&<button style={{...S.btn,background:C.purple,padding:"8px 14px",fontSize:"12px"}} onClick={()=>{setImportState("idle");setImportRows([]);setImportErr("");setImportResult(null);setImportFile("");setModal("import");}}>⬆ Import Statement</button>}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
                    <DateFilter f={fHaulingExp} setF={setFHaulingExp}/>
                    <span style={{fontSize:"11px",color:C.muted}}>{filtered.length} of {dateFiltered.length} · {fmt(total)}</span>

                <div style={S.g3}>
                  {[["Total Expenses",fmt(total),C.red],["Deductible",fmt(deductible),C.orange],["Non-Deductible (Principal)",fmt(total-deductible),C.muted]].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"18px",fontWeight:"700",color:col,marginTop:"4px"}}>{v}</div></div>

                </div>
                {isMobile?(
                  <div style={{marginTop:"12px",display:"flex",flexDirection:"column",gap:"8px"}}>
                    {filtered.length===0&&<div style={{...S.card,textAlign:"center",color:C.muted,padding:"36px"}}>No expenses in this period</div>}
                    {filtered.map(e=>(
                      <div key={e.id} style={{...S.card,padding:"14px",cursor:"pointer",borderLeft:`3px solid ${C.red}`}} onClick={()=>{openViewExpense(e);}}>

                            </div>
                            <div style={{display:"flex",gap:"6px",marginTop:"5px",flexWrap:"wrap",alignItems:"center"}}>
                              <span style={{fontSize:"11px",color:C.muted}}>{fmtDate(e.date)}</span>
                              <span style={S.badge(C.blue)}>{e.category}</span>
                              {e.payee&&<span style={{fontSize:"11px",color:C.muted}}>{e.payee}</span>}
                            </div>
                          </div>
                          <div style={{fontWeight:"700",fontSize:"15px",color:C.red,whiteSpace:"nowrap"}}>{fmt(e.amount)}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                ):(
                  <div style={{...S.card,marginTop:"16px"}}><table style={S.tbl}><thead><tr>{["Date","Description","Category","Payee","Amount",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                    {filtered.length===0&&<tr><td colSpan={6} style={{...S.td,textAlign:"center",color:C.muted,padding:"36px"}}>No expenses in this period</td></tr>}
                    {filtered.map(e=>(
                      <tr key={e.id} className="hrow" style={{cursor:"pointer"}} onClick={()=>{openViewExpense(e);}}>
                        <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(e.date)}</td>
                        <td style={S.td}><div style={{display:"flex",alignItems:"center",gap:"5px"}}>{e.receiptB64&&<span>🧾</span>}<div><div>{e.desc}</div>{e.notes&&<div style={{fontSize:"11px",color:C.muted}}>{e.notes}</div>}</div></div></td>
                        <td style={S.td}><span style={S.badge(C.blue)}>{e.category}</span></td>
                        <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{e.payee||"--"}</td>
                        <td style={{...S.td,fontWeight:"700"}}>{fmt(e.amount)}</td>
                        <td style={S.td} onClick={ev=>ev.stopPropagation()}><button onClick={()=>deleteExpense(e.id)} style={S.xBtn}>×</button></td>
                      </tr>
                    ))}
                    {filtered.length>0&&<tr style={{borderTop:`2px solid ${C.border}`}}><td colSpan={4} style={{...S.td,fontWeight:"700",color:C.muted,fontSize:"11px"}}>TOTAL</td><td style={{...S.td,fontWeight:"700",fontSize:"15px"}}>{fmt(total)}</td><td style={S.td}/></tr>}
                  </tbody></table></div>
                )}
              </>;
            })()}

            {/* -- MILEAGE TAB -- */}
            {haulingTab==="mileage"&&(()=>{
              const filtered=trips.filter(t=>inDateRange(t.date,fMile)).sort((a,b)=>b.date.localeCompare(a.date));
              const totalMiles=filtered.reduce((s,t)=>s+t.miles,0);
              const bizMiles=filtered.filter(t=>t.purpose!=="Personal").reduce((s,t)=>s+t.miles,0);
              const ActiveTripBanner=(()=>{
                if(!activeTrip)return null;
                const elapsed=Math.floor((Date.now()-activeTrip.startedAt)/60000);
                const hrs=Math.floor(elapsed/60),mins=elapsed%60;
                const elapsedStr=hrs>0?`${hrs}h ${mins}m`:`${mins}m`;
                return (
                  <div style={{...S.card,border:`2px solid ${C.teal}`,background:C.tealD,marginBottom:"16px",position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",top:0,left:0,right:0,height:"2px",background:`linear-gradient(90deg,${C.teal},transparent)`,animation:"pulse 2s infinite"}}/>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
                      <div>
                        <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                          <span style={{width:"8px",height:"8px",borderRadius:"50%",background:C.teal,display:"inline-block",boxShadow:`0 0 6px ${C.teal}`}}/>
                          <span style={{fontWeight:"700",color:C.teal,fontSize:"14px"}}>Trip in Progress</span>
                          <span style={S.badge(C.teal)}>{activeTrip.purpose}</span>
                        </div>
                        <div style={{fontSize:"12px",color:C.muted,marginTop:"4px"}}>
                          Started {fmtDate(activeTrip.date)} · <span style={{color:C.text}}>{elapsedStr} elapsed</span>
                          {activeTrip.startOdometer&&<> · Start: <span style={{color:C.text}}>{activeTrip.startOdometer}</span></>}
                        </div>
                      </div>
                      <div style={{display:"flex",gap:"8px"}}>
                        <button onClick={()=>{setEndTripForm({endOdometer:"",desc:"",notes:""});setModal("endTrip");}} style={{...S.btn,background:C.red,padding:"6px 14px",fontSize:"12px"}}>■ End Trip</button>
                        <button onClick={cancelActiveTrip} style={{...S.bgh,padding:"6px 10px",fontSize:"11px",color:C.muted}}>Discard</button>
                      </div>
                    </div>
                  </div>
                );
              })();
              return <>
                {ActiveTripBanner}
                {!activeTrip&&isMobile&&<button style={{...S.btn,background:C.teal,padding:"8px 16px",fontSize:"12px",width:"100%",marginBottom:"12px"}} onClick={()=>setModal("startTrip")}>▶ Start Trip</button>}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexWrap:"wrap",gap:"8px"}}>
                  <DateFilter f={fMile} setF={setFMile}/>
                  <span style={{fontSize:"11px",color:C.muted}}>{filtered.length} trips</span>
                </div>
                <div style={S.g3}>
                  {[["Total Miles",totalMiles.toFixed(1)+" mi",C.blue],["Business Miles",bizMiles.toFixed(1)+" mi",C.teal],["Business Use",totalMiles>0?(bizMiles/totalMiles*100).toFixed(1)+"%":"--",C.orange]].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"20px",fontWeight:"700",color:col,marginTop:"4px"}}>{v}</div></div>
                  ))}
                </div>
                {isMobile?(
                  <div style={{marginTop:"12px",display:"flex",flexDirection:"column",gap:"8px"}}>
                    {filtered.length===0&&<div style={{...S.card,textAlign:"center",color:C.muted,padding:"36px"}}>No trips logged</div>}
                    {filtered.map(t=>(
                      <div key={t.id} style={{...S.card,padding:"14px",borderLeft:`3px solid ${t.purpose==="Personal"?C.muted:C.teal}`}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                          <div style={{fontWeight:"600",fontSize:"13px",flex:1}}>{t.desc||"Trip"}</div>
                          <div style={{fontWeight:"700",color:C.blue,whiteSpace:"nowrap"}}>{t.miles} mi</div>
                        </div>
                        <div style={{display:"flex",gap:"6px",marginTop:"5px",flexWrap:"wrap",alignItems:"center"}}>
                          <span style={{fontSize:"11px",color:C.muted}}>{fmtDate(t.date)}</span>
                          <span style={S.badge(t.purpose==="Personal"?C.muted:C.teal)}>{t.purpose}</span>
                          {t.startOdometer&&<span style={{fontSize:"11px",color:C.muted}}>{t.startOdometer}→{t.endOdometer}</span>}
                        </div>
                        <div style={{display:"flex",gap:"8px",marginTop:"8px"}}>
                          <button onClick={()=>startEditTrip(t)} style={{...S.bgh,flex:"none",fontSize:"11px",padding:"4px 10px",color:C.blue,borderColor:C.blue+"44"}}>Edit</button>
                          <button onClick={()=>deleteTrip(t.id)} style={{...S.bgh,flex:"none",fontSize:"11px",padding:"4px 10px",color:C.red,borderColor:C.red+"44"}}>Delete</button>
                        </div>
                      </div>
                    ))}
                  </div>
                ):(
                  <div style={{...S.card,marginTop:"16px"}}><table style={S.tbl}><thead><tr>{["Date","Description","Purpose","Start Odo","End Odo","Miles",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                    {filtered.length===0&&<tr><td colSpan={7} style={{...S.td,textAlign:"center",color:C.muted,padding:"36px"}}>No trips logged</td></tr>}
                    {filtered.map(t=>(
                      <tr key={t.id}>
                        <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(t.date)}</td>
                        <td style={{...S.td,fontWeight:"600"}}>{t.desc}</td>
                        <td style={S.td}><span style={S.badge(t.purpose==="Personal"?C.muted:C.teal)}>{t.purpose}</span></td>
                        <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{t.startOdometer||"--"}</td>
                        <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{t.endOdometer||"--"}</td>
                        <td style={{...S.td,fontWeight:"700"}}>{t.miles} mi</td>
                        <td style={S.td}><button onClick={()=>startEditTrip(t)} style={{...S.xBtn,color:C.blue,fontSize:"12px",fontWeight:"700"}}>Edit</button><button onClick={()=>deleteTrip(t.id)} style={S.xBtn}>×</button></td>
                      </tr>
                    ))}
                  </tbody></table></div>
                )}
              </>;
            })()}

            {/* -- ASSETS TAB -- */}
            {haulingTab==="assets"&&(
              <>
                <div style={{...S.card,background:C.yellowD,border:`1px solid ${C.yellow}44`,marginBottom:"16px",fontSize:"12px",color:C.yellow}}>
                  🔧 Equipment and vehicles tracked here for depreciation / Section 179 -- give to your accountant at tax time
                </div>
                <div style={S.g3}>
                  {[["Total Asset Value",fmt(assets.reduce((s,a)=>s+a.cost,0)),C.orange],["Items Tracked",assets.length+" assets",C.blue],["Section 179","Consult accountant",C.yellow]].map(([l,v,col])=>(
                    <div key={l} style={S.card}><div style={S.sl}>{l}</div><div style={{fontSize:"16px",fontWeight:"700",color:col,marginTop:"6px"}}>{v}</div></div>
                  ))}
                </div>
                <div style={{...S.card,marginTop:"16px"}}><table style={S.tbl}><thead><tr>{["Date","Asset","Vendor","Cost","Notes",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                  {assets.length===0&&<tr><td colSpan={6} style={{...S.td,textAlign:"center",color:C.muted,padding:"36px"}}>No assets recorded</td></tr>}
                  {assets.map(a=>(
                    <tr key={a.id}>
                      <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(a.date)}</td>
                      <td style={{...S.td,fontWeight:"700"}}>{a.name}</td>
                      <td style={{...S.td,color:C.muted}}>{a.vendor}</td>
                      <td style={{...S.td,fontWeight:"700",color:C.orange}}>{fmt(a.cost)}</td>
                      <td style={{...S.td,fontSize:"11px",color:C.yellow}}>{a.notes}</td>
                      <td style={S.td}><button onClick={()=>startEditAsset(a)} style={{...S.xBtn,color:C.blue,fontSize:"12px",fontWeight:"700"}}>Edit</button><button onClick={()=>deleteAsset(a.id)} style={S.xBtn}>×</button></td>
                    </tr>
                  ))}
                  {assets.length>0&&<tr style={{borderTop:`2px solid ${C.border}`}}><td colSpan={3} style={{...S.td,fontWeight:"700",color:C.muted,fontSize:"11px"}}>TOTAL</td><td style={{...S.td,fontWeight:"700",color:C.orange,fontSize:"16px"}}>{fmt(assets.reduce((s,a)=>s+a.cost,0))}</td><td colSpan={2} style={S.td}/></tr>}
                </tbody></table></div>
              </>
            )}
          </>
        )}

        {/* ==================================================================
            REPORTS MODULE
        ================================================================== */}
        {view==="reports"&&(()=>{
          const inRange=(date)=>{if(reportRange==="year")return date.startsWith(reportYear);return date>=reportStart&&date<=reportEnd;};

          // -- Shared date filter bar --
          const FilterBar = () => (
            <div style={{...S.card,marginBottom:"16px",display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap"}}>
              <div style={{display:"flex",gap:"4px"}}>
                <button style={{...S.tb(reportRange==="year",C.blue),flex:"none",padding:"5px 12px",fontSize:"11px"}} onClick={()=>setReportRange("year")}>Year</button>
                <button style={{...S.tb(reportRange==="custom",C.purple),flex:"none",padding:"5px 12px",fontSize:"11px"}} onClick={()=>setReportRange("custom")}>Custom</button>
              </div>
              {reportRange==="year"?(
                <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                  {allDataYears.map(y=><button key={y} style={{...S.tb(reportYear===y,C.orange),flex:"none",padding:"5px 14px",fontSize:"12px",fontWeight:"700"}} onClick={()=>setReportYear(y)}>{y}</button>)}
                </div>
              ):(
                <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                  <input type="date" style={{...S.inp,width:"auto"}} value={reportStart} onChange={e=>setReportStart(e.target.value)}/>
                  <span style={{color:C.muted}}>→</span>
                  <input type="date" style={{...S.inp,width:"auto"}} value={reportEnd} onChange={e=>setReportEnd(e.target.value)}/>
                </div>
              )}
            </div>
          );

          // -- Drill-down modal --
          const DrillModal = () => {
            if(!drillData) return null;
            return (
              <div style={S.modal} onClick={e=>e.target===e.currentTarget&&setDrillData(null)}>
                <div style={{...S.mbox,maxWidth:"640px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
                    <div style={{fontWeight:"700",fontSize:"16px"}}>{drillData.title}</div>
                    <button onClick={()=>setDrillData(null)} style={S.xBtn}>×</button>
                  </div>
                  <div style={{fontSize:"12px",color:C.muted,marginBottom:"12px"}}>{drillData.rows.length} transactions · {fmt(drillData.rows.reduce((s,r)=>s+r.amount,0))}</div>
                  <div style={{overflowY:"auto",maxHeight:"400px"}}>
                    <table style={S.tbl}><thead><tr>{["Date","Description","Payee","Amount",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                      {drillData.rows.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>(
                        <tr key={r.id} onClick={()=>{setDrillData(null);startEditExpense(r);setModal("expense");}} style={{cursor:"pointer"}}>
                          <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(r.date)}</td>
                          <td style={S.td}>{r.desc}</td>
                          <td style={{...S.td,color:C.muted,fontSize:"12px"}}>{r.payee||"--"}</td>
                          <td style={{...S.td,fontWeight:"700"}}>{fmt(r.amount)}</td>
                          <td style={S.td} onClick={ev=>ev.stopPropagation()}><button onClick={()=>deleteExpense(r.id)} style={{...S.xBtn,color:C.red}}>×</button></td>
                        </tr>
                      ))}
                    </tbody></table>
                  </div>
                  <div style={{...S.br,marginTop:"16px"}}>
                    <button style={S.bgh} onClick={()=>setDrillData(null)}>Close</button>
                  </div>
                </div>
              </div>
            );
          };

          // Drillable number cell
          const Drill = ({rows, children, col=C.text}) => (
            <span onClick={()=>rows&&rows.length>0&&setDrillData({title:typeof children==="string"?children:"Transactions",rows})}
              style={{color:col,cursor:rows&&rows.length>0?"pointer":"default",textDecoration:rows&&rows.length>0?"underline dotted":"none",textUnderlineOffset:"3px"}}>
              {children}
            </span>
          );

          return (
          <>
            <DrillModal/>

            {/* -- HAULING REPORT -- */}
            {(()=>{
              const rInc=haulingIncome.filter(i=>inRange(i.date));
              const rExp=haulingExpenses.filter(e=>inRange(e.date));
              const rDed=rExp.filter(e=>e.category!=="Loan Payment (Principal)");
              const totalInc=rInc.reduce((s,i)=>s+i.amount,0);
              const totalDed=rDed.reduce((s,e)=>s+e.amount,0);
              const netProfit=totalInc-totalDed;

              // Monthly P&L
              const monthMap={};
              rInc.forEach(i=>{const m=i.date.slice(0,7);if(!monthMap[m])monthMap[m]={inc:0,incRows:[],expRows:[]};monthMap[m].inc+=i.amount;monthMap[m].incRows.push(i);});
              rExp.forEach(e=>{const m=e.date.slice(0,7);if(!monthMap[m])monthMap[m]={inc:0,incRows:[],expRows:[]};monthMap[m].expRows.push(e);});
              const months=Object.entries(monthMap).sort((a,b)=>b[0].localeCompare(a[0]));

              // Schedule C tax map
              const taxMap={};
              rDed.forEach(e=>{const k=TAX_MAP[e.category]||"Miscellaneous";if(!taxMap[k])taxMap[k]=[];taxMap[k].push(e);});
              const taxRows=Object.entries(taxMap).sort((a,b)=>b[1].reduce((s,e)=>s+e.amount,0)-a[1].reduce((s,e)=>s+e.amount,0));

              return (<>
                <FilterBar/>
                <div style={S.g3}>
                  {[{l:"Revenue",v:fmt(totalInc),col:C.teal,sub:`${rInc.length} jobs`},{l:"Deductible Exp.",v:fmt(totalDed),col:C.red,sub:"Schedule C"},{l:"Net Profit",v:fmt(netProfit),col:netProfit>=0?C.teal:C.red,sub:"After deductibles"}].map(s=>(
                    <div key={s.l} style={S.card}><div style={S.sl}>{s.l}</div><div style={{...S.sv,color:s.col,marginTop:"4px"}}>{s.v}</div><div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{s.sub}</div></div>
                  ))}
                </div>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"24px",marginBottom:"8px",borderBottom:`1px solid ${C.border}`,paddingBottom:"6px"}}>
                  <span style={{fontSize:"10px",color:C.muted,letterSpacing:"3px",textTransform:"uppercase"}}>Monthly P&amp;L -- click any row to drill in</span>
                  <div style={{display:"flex",gap:"6px"}}>
                    <button onClick={()=>exportCSV("hauling-jobs")} style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px"}}>Jobs CSV</button>
                    <button onClick={()=>exportCSV("hauling-exp")} style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px"}}>Expenses CSV</button>
                  </div>
                </div>
                <div style={S.card}><table style={S.tbl}><thead><tr>{["Month","Revenue","Expenses","Net"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                  {months.length===0&&<tr><td colSpan={4} style={{...S.td,textAlign:"center",color:C.muted,padding:"24px"}}>No data for this period</td></tr>}
                  {months.map(([m,d])=>{
                    const exp=d.expRows.reduce((s,e)=>s+e.amount,0);
                    const net=d.inc-exp;
                    return(
                      <tr key={m} className="hrow" style={{cursor:"pointer"}} onClick={()=>setDrillData({title:monthLabel(m)+" -- All Transactions",rows:[...d.incRows.map(i=>({...i,desc:i.customer+" ("+i.jobType+")",payee:""})),...d.expRows]})}>
                        <td style={{...S.td,fontWeight:"700"}}>{monthLabel(m)}</td>
                        <td style={{...S.td,color:C.teal}}>{fmt(d.inc)}</td>
                        <td style={{...S.td,color:C.red}}>{fmt(exp)}</td>
                        <td style={{...S.td,fontWeight:"700",color:net>=0?C.teal:C.red}}>{net>=0?"+":""}{fmt(net)}</td>
                      </tr>
                    );
                  })}
                  {months.length>1&&(()=>{const totExp=months.reduce((s,[,d])=>s+d.expRows.reduce((ss,e)=>ss+e.amount,0),0);const totNet=totalInc-totExp;return(
                    <tr style={{borderTop:`2px solid ${C.border}`,background:C.faint}}>
                      <td style={{...S.td,fontWeight:"700",fontSize:"11px",color:C.muted}}>TOTAL</td>
                      <td style={{...S.td,fontWeight:"700",color:C.teal}}>{fmt(totalInc)}</td>
                      <td style={{...S.td,fontWeight:"700",color:C.red}}>{fmt(totExp)}</td>
                      <td style={{...S.td,fontWeight:"700",color:totNet>=0?C.teal:C.red,fontSize:"14px"}}>{totNet>=0?"+":""}{fmt(totNet)}</td>
                    </tr>
                  );})()}
                </tbody></table></div>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"24px",marginBottom:"8px",borderBottom:`1px solid ${C.border}`,paddingBottom:"6px"}}>
                  <span style={{fontSize:"10px",color:C.muted,letterSpacing:"3px",textTransform:"uppercase"}}>Schedule C -- click any category to see transactions</span>
                  <button onClick={()=>exportCSV("tax")} style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px",color:C.teal,borderColor:C.teal+"44"}}>Schedule C CSV</button>
                </div>
                <div style={S.card}>
                  <div style={{padding:"10px 12px",background:C.bg,borderRadius:"7px",marginBottom:"14px",fontSize:"11px",color:C.muted}}>📋 Deductible expenses only. Loan principal excluded.</div>
                  <table style={S.tbl}><thead><tr>{["Tax Category","Amount",""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
                    {taxRows.length===0&&<tr><td colSpan={3} style={{...S.td,textAlign:"center",color:C.muted,padding:"24px"}}>No deductible expenses</td></tr>}
                    {taxRows.map(([cat,rows])=>{
                      const amt=rows.reduce((s,e)=>s+e.amount,0);
                      return(
                        <tr key={cat} className="hrow" style={{cursor:"pointer"}} onClick={()=>setDrillData({title:`Schedule C -- ${cat}`,rows})}>
                          <td style={S.td}>{cat}</td>
                          <td style={{...S.td,fontWeight:"700",color:C.orange}}>{fmt(amt)}</td>
                          <td style={{...S.td,color:C.muted,fontSize:"11px"}}>↗ {rows.length} transactions</td>
                        </tr>
                      );
                    })}
                    {taxRows.length>0&&<tr style={{borderTop:`2px solid ${C.border}`}}><td style={{...S.td,fontWeight:"700"}}>TOTAL DEDUCTIBLE</td><td style={{...S.td,fontWeight:"700",color:C.teal,fontSize:"15px"}}>{fmt(totalDed)}</td><td style={S.td}/></tr>}
                  </tbody></table>
                </div>

                {/* Mileage summary */}
                {trips.filter(t=>inRange(t.date)).length>0&&(<>
