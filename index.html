                {receiptState==="review"&&receiptData&&(
                  <div style={{background:C.bg,border:`1px solid ${C.purple}44`,borderRadius:"8px",padding:"12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
                      <div style={{fontSize:"11px",fontWeight:"700",color:C.purple}}>📋 Receipt scanned</div>
                      <span style={{padding:"2px 7px",borderRadius:"4px",fontSize:"10px",fontWeight:"700",background:receiptData.confidence==="high"?C.tealD:C.yellowD,color:receiptData.confidence==="high"?C.teal:C.yellow}}>{receiptData.confidence} confidence</span>
                    </div>
                    {receiptData.isPdf?<PdfViewer b64={receiptData.b64}/>:<img src={`data:${receiptData.mediaType};base64,${receiptData.b64}`} alt="Receipt" style={{width:"100%",borderRadius:"6px",marginBottom:"8px",cursor:"zoom-in",maxHeight:"200px",objectFit:"contain",background:"#fff"}} onClick={()=>window.open(`data:${receiptData.mediaType};base64,${receiptData.b64}`,"_blank")}/>}
                    <button style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px",marginTop:"6px"}} onClick={()=>{setReceiptState("idle");setReceiptData(null);}}>× Remove</button>
                  </div>
                )}
              </div>
            )}

            <div style={{padding:"8px 12px",background:C.orangeD,border:`1px solid ${C.orange}44`,borderRadius:"8px",marginBottom:"4px",fontSize:"12px",color:C.orange,fontWeight:"700"}}>
              🚛 Hauling expense
            </div>
            <div style={S.row}>
              <div style={{flex:1}}><label style={S.lbl}>Date</label><input type="date" style={S.inp} value={expForm.date} onChange={e=>setExpForm(f=>({...f,date:e.target.value}))}/></div>
              <div style={{flex:2}}><label style={S.lbl}>Description *</label><input style={S.inp} placeholder="What was this?" value={expForm.desc} onChange={e=>setExpForm(f=>({...f,desc:e.target.value}))}/></div>
            </div>
            <div style={S.row}>
              <div style={{flex:1}}><label style={S.lbl}>Amount ($) *</label><input type="number" style={S.inp} placeholder="0.00" value={expForm.amount} onChange={e=>setExpForm(f=>({...f,amount:e.target.value}))}/></div>
              <div style={{flex:1}}><label style={S.lbl}>Category</label>
                <select style={S.sel} value={expForm.category} onChange={e=>setExpForm(f=>({...f,category:e.target.value}))}>
                  {BUSINESS_CATS.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
            </div>
            <label style={S.lbl}>Payee / Vendor</label>
            <VendorInput value={expForm.payee} onChange={v=>setExpForm(f=>({...f,payee:v}))} vendors={vendors} addVendor={addVendor}/>
            <label style={S.lbl}>Notes</label>
            <input style={S.inp} placeholder="Optional" value={expForm.notes} onChange={e=>setExpForm(f=>({...f,notes:e.target.value}))}/>
            {editingId&&expForm.receiptB64&&<div style={{marginTop:"10px"}}>{expForm.receiptIsPdf?<PdfViewer b64={expForm.receiptB64}/>:<img src={`data:${expForm.receiptMediaType};base64,${expForm.receiptB64}`} alt="Receipt" style={{width:"100%",borderRadius:"6px",maxHeight:"160px",objectFit:"contain",background:"#fff"}}/>}</div>}
            <div style={S.br}><button style={S.btn} onClick={saveExpense}>{editingId?"Update Expense":"Save Expense"}</button><button style={S.bgh} onClick={()=>{setModal(null);setEditingId(null);setExpForm(blankExp);setReceiptState("idle");setReceiptData(null);setExpModalContext(null);}}>Cancel</button></div>
          </div>
        </div>
      )}

      {/* -- IMPORT CARD STATEMENT -- */}
      {modal==="import"&&(()=>{
        const STATUS={
          new:      [C.teal,  "New"],
          needcat:  [C.orange,"Needs category"],
          logged:   [C.yellow,"Already logged"],
          maybedup: [C.yellow,"Possible duplicate"],
          refund:   [C.blue,  "Refund"],
          payment:  [C.muted, "Card payment"],
          reversal: [C.red,   "Not an expense"],
          handled:  [C.muted, "Seen before"],
        };
        const visible=importRows.filter(r=>showHandled||!r.handled);
        const chosen=importRows.filter(r=>r.include);
        const chosenTotal=chosen.reduce((s,r)=>s+((r.kind==="refund"||r.kind==="credit")?-r.amount:r.amount),0);
        // "Select all" only ticks genuinely new charges -- never payments, refunds,
        // or lines already in the books, so it can't quietly create duplicates.
        const selectable=(r)=>r.kind==="expense"&&r.status!=="logged"&&r.status!=="maybedup"&&!r.handled;
        const setAll=(v)=>setImportRows(p=>p.map(r=>{
          if(!(showHandled||!r.handled)) return r;
          if(v) return selectable(r)?{...r,include:true}:r;
          return {...r,include:false};
        }));
        return (
        <div style={S.modal} onClick={e=>e.target===e.currentTarget&&closeImport()}>
          <div style={{...S.mbox,maxWidth:"940px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"4px"}}>
              <div>
                <div style={S.mt}>Import Card Statement</div>
                <div style={S.ms}>{importFile?importFile:"Drop in a CSV exported from your card issuer"}</div>
              </div>
              <button onClick={closeImport} style={S.xBtn}>×</button>
            </div>

            {/* ---- pick a file ---- */}
            {importState==="idle"&&(
              <div
                onDragOver={e=>{e.preventDefault();}}
                onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)loadStatement(f);}}
                style={{border:`2px dashed ${C.purple}66`,borderRadius:"12px",background:C.purpleD,padding:"36px 20px",textAlign:"center"}}>
                <div style={{fontSize:"30px",marginBottom:"8px"}}>📄</div>
                <div style={{fontWeight:"700",fontSize:"14px",marginBottom:"4px"}}>Drop your statement CSV here</div>
                <div style={{fontSize:"12px",color:C.muted,marginBottom:"16px",lineHeight:1.6}}>
                  Nothing is saved until you review it. Anything you've already imported<br/>or excluded before is remembered, so the same file can be dropped in again safely.
                </div>
                <button style={{...S.btn,flex:"none",background:C.purple,padding:"9px 20px",fontSize:"13px"}} onClick={()=>stmtRef.current&&stmtRef.current.click()}>Choose file</button>
              </div>
            )}

            {/* ---- review ---- */}
            {importState==="review"&&importErr&&(
              <div style={{padding:"14px",background:C.redD,border:`1px solid ${C.red}44`,borderRadius:"8px",marginBottom:"12px"}}>
                <div style={{color:C.red,fontWeight:"700",fontSize:"13px",marginBottom:"6px"}}>⚠️ {importErr}</div>
                <button style={{...S.bgh,flex:"none",padding:"5px 12px",fontSize:"11px"}} onClick={()=>{setImportErr("");setImportState("idle");}}>Try another file</button>
              </div>
            )}
            {importState==="review"&&!importErr&&importRows.length>0&&(<>
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"10px",fontSize:"11px",color:C.muted}}>
                <span><strong style={{color:C.text}}>{importRows.length}</strong> lines read</span>
                <span>·</span>
                <span><strong style={{color:C.teal}}>{chosen.length}</strong> selected to import</span>
                {importSkipped>0&&<><span>·</span><span><strong style={{color:C.muted}}>{importSkipped}</strong> handled previously</span></>}
                <div style={{marginLeft:"auto",display:"flex",gap:"6px",alignItems:"center"}}>
                  {importSkipped>0&&(
                    <button style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px"}} onClick={()=>setShowHandled(s=>!s)}>
                      {showHandled?"Hide":"Show"} previously handled
                    </button>
                  )}
                  <button style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px"}} onClick={()=>setAll(true)}>Select all</button>
                  <button style={{...S.bgh,flex:"none",padding:"4px 10px",fontSize:"10px"}} onClick={()=>setAll(false)}>None</button>
                </div>
              </div>
              <div style={{overflowX:"auto",overflowY:"auto",maxHeight:"46vh",border:`1px solid ${C.border}`,borderRadius:"10px"}}>
                <table style={{...S.tbl,minWidth:"760px"}}>
                  <thead><tr>
                    {["","Date","Merchant","Amount","Category","Status"].map((h,i)=><th key={i} style={{...S.th,position:"sticky",top:0,background:C.surface,zIndex:2}}>{h}</th>)}
                  </tr></thead>
                  <tbody>
                    {visible.map(r=>{
                      const [col,label]=STATUS[r.status]||[C.muted,r.status];
                      const isCost=r.kind==="expense";
                      return (
                        <tr key={r.fp} style={{opacity:r.include?1:0.55,background:r.include?"transparent":C.bg}}>
                          <td style={{...S.td,width:"34px"}}>
                            <input type="checkbox" checked={r.include} onChange={e=>setImportRow(r.fp,{include:e.target.checked})}
                              style={{width:"16px",height:"16px",accentColor:C.teal,cursor:"pointer"}}/>
                          </td>
                          <td style={{...S.td,color:C.muted,fontSize:"11px",whiteSpace:"nowrap"}}>{fmtDate(r.date)}</td>
                          <td style={S.td}>
                            <div style={{fontWeight:"600",fontSize:"13px"}}>{r.payee}</div>
                            <div style={{fontSize:"10px",color:C.muted,fontFamily:"'Courier New',monospace"}}>{r.desc}</div>
                          </td>
                          <td style={{...S.td,fontWeight:"700",whiteSpace:"nowrap",color:isCost?C.text:C.blue}}>
                            {(r.kind==="refund"||r.kind==="credit")?"-":""}{fmt(r.amount)}
                          </td>
                          <td style={S.td}>
                            {isCost||r.kind==="refund"||r.kind==="credit"?(
                              <select style={{...S.sel,padding:"5px 8px",fontSize:"11px",minWidth:"150px",borderColor:r.category?C.border:C.orange}}
                                value={r.category} onChange={e=>setImportRow(r.fp,{category:e.target.value,status:r.status==="needcat"&&e.target.value?"new":r.status})}>
                                <option value="">-- choose --</option>
                                {BUSINESS_CATS.map(c=><option key={c} value={c}>{c}</option>)}
                              </select>
                            ):<span style={{color:C.muted,fontSize:"11px"}}>--</span>}
                            {r.why&&r.category&&<div style={{fontSize:"9px",color:C.muted,marginTop:"2px"}}>{r.why}</div>}
                          </td>
                          <td style={S.td}>
                            <span style={S.badge(col)}>{label}</span>
                            {r.note&&<div style={{fontSize:"10px",color:C.muted,marginTop:"3px",maxWidth:"150px"}}>{r.note}</div>}
                          </td>
                        </tr>
                      );
                    })}
                    {visible.length===0&&<tr><td colSpan={6} style={{...S.td,textAlign:"center",color:C.muted,padding:"28px"}}>
                      Every line in this file has already been imported or excluded. Nothing new to add.
                    </td></tr>}
                  </tbody>
                </table>
              </div>
              <div style={{...S.br,alignItems:"center"}}>
                <button style={{...S.btn,background:chosen.length?C.teal:C.muted+"55"}} disabled={!chosen.length} onClick={runImport}>
                  {chosen.length?`Import ${chosen.length} expense${chosen.length===1?"":"s"} · ${fmt(chosenTotal)}`:"Nothing selected"}
                </button>
                <button style={S.bgh} onClick={closeImport}>Cancel</button>
              </div>
            </>)}

            {/* ---- saving ---- */}
            {importState==="saving"&&(
              <div style={{textAlign:"center",padding:"40px"}}>
                <div style={{fontSize:"28px",marginBottom:"8px"}}>⏳</div>
                <div style={{fontWeight:"700",fontSize:"14px",color:C.teal}}>Saving expenses...</div>
              </div>
            )}

            {/* ---- done ---- */}
            {importState==="done"&&importResult&&(
              <div style={{textAlign:"center",padding:"28px 12px"}}>
                <div style={{fontSize:"32px",marginBottom:"10px"}}>✅</div>
                <div style={{fontWeight:"700",fontSize:"16px",marginBottom:"6px"}}>
                  Added {importResult.added} expense{importResult.added===1?"":"s"} · {fmt(importResult.total)}
                </div>
                <div style={{fontSize:"12px",color:C.muted,lineHeight:1.6,maxWidth:"420px",margin:"0 auto"}}>
                  {importResult.skipped>0&&<>{importResult.skipped} line{importResult.skipped===1?" was":"s were"} excluded and won't be offered again. </>}
                  Drop this same file in whenever you like -- everything above is remembered, so only new charges will come up.
                </div>
                <div style={{...S.br,justifyContent:"center",marginTop:"22px"}}>
                  <button style={{...S.btn,flex:"none",padding:"9px 22px"}} onClick={closeImport}>Done</button>
                  <button style={{...S.bgh,flex:"none",padding:"9px 22px"}} onClick={()=>{setImportState("idle");setImportRows([]);setImportResult(null);setImportFile("");}}>Import another</button>
                </div>
              </div>
            )}
          </div>
        </div>
        );
      })()}

      {/* -- ADD/EDIT ASSET -- */}
      {modal==="asset"&&(
        <div style={S.modal} onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div style={S.mbox}>
            <div style={S.mt}>{editingId?"Edit Asset":"Add Asset"}</div>
            <div style={S.ms}>Equipment and vehicles -- for depreciation / Section 179</div>
            <label style={S.lbl}>Asset Name *</label>
            <input style={S.inp} placeholder="e.g. 2024 Ford F250" value={assetForm.name} onChange={e=>setAssetForm(f=>({...f,name:e.target.value}))}/>
            <div style={S.row}>
              <div style={{flex:1}}><label style={S.lbl}>Purchase Date</label><input type="date" style={S.inp} value={assetForm.date} onChange={e=>setAssetForm(f=>({...f,date:e.target.value}))}/></div>
              <div style={{flex:1}}><label style={S.lbl}>Cost ($) *</label><input type="number" style={S.inp} placeholder="0.00" value={assetForm.cost} onChange={e=>setAssetForm(f=>({...f,cost:e.target.value}))}/></div>
            </div>
            <label style={S.lbl}>Vendor</label>
            <VendorInput value={assetForm.vendor} onChange={v=>setAssetForm(f=>({...f,vendor:v}))} placeholder="e.g. Davies Ford" vendors={vendors} addVendor={addVendor}/>
            <label style={S.lbl}>Notes</label>
            <input style={S.inp} placeholder="VIN, Section 179, etc." value={assetForm.notes} onChange={e=>setAssetForm(f=>({...f,notes:e.target.value}))}/>
            <div style={S.br}><button style={{...S.btn,background:C.yellow}} onClick={saveAsset}>{editingId?"Update":"Add Asset"}</button><button style={S.bgh} onClick={()=>{setModal(null);setEditingId(null);setAssetForm(blankAsset);}}>Cancel</button></div>
          </div>
        </div>
      )}

      {/* -- LOG TRIP -- */}
      {modal==="trip"&&(
        <div style={S.modal}>
          <div style={S.mbox}>
            <div style={S.mt}>{editingId?"Edit Trip":"Log Trip"}</div>
            <div style={S.row}>
              <div style={{flex:1}}><label style={S.lbl}>Date</label><input type="date" style={S.inp} value={tripForm.date} onChange={e=>setTripForm(f=>({...f,date:e.target.value}))}/></div>
              <div style={{flex:2}}><label style={S.lbl}>Description *</label><input style={S.inp} placeholder="e.g. Dump run to Rostraver" value={tripForm.desc} onChange={e=>setTripForm(f=>({...f,desc:e.target.value}))}/></div>
            </div>
            <label style={S.lbl}>Purpose</label>
            <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
              {["Business","Dump Run","Client Visit","Supply Run","Equipment"].map(p=>(
                <button key={p} style={{...S.tb(tripForm.purpose===p,C.blue),flex:"none",padding:"6px 10px",fontSize:"11px"}} onClick={()=>setTripForm(f=>({...f,purpose:p}))}>{p}</button>
              ))}
            </div>
            <div style={S.row}>
              <div style={{flex:1}}><label style={S.lbl}>Start Odometer</label><input type="number" style={S.inp} placeholder="42100" value={tripForm.startOdometer} onChange={e=>{const s=e.target.value;const end=tripForm.endOdometer;const diff=end&&s?Math.max(0,parseFloat(end)-parseFloat(s)):null;setTripForm(f=>({...f,startOdometer:s,miles:diff!==null?String(diff.toFixed(1)):f.miles}));}}/></div>
              <div style={{flex:1}}><label style={S.lbl}>End Odometer</label><input type="number" style={S.inp} placeholder="42165" value={tripForm.endOdometer} onChange={e=>{const end=e.target.value;const s=tripForm.startOdometer;const diff=end&&s?Math.max(0,parseFloat(end)-parseFloat(s)):null;setTripForm(f=>({...f,endOdometer:end,miles:diff!==null?String(diff.toFixed(1)):f.miles}));}}/></div>
            </div>
            {tripForm.startOdometer&&tripForm.endOdometer&&<div style={{fontSize:"12px",color:C.blue,marginTop:"2px"}}>Auto-calc: {Math.max(0,parseFloat(tripForm.endOdometer||0)-parseFloat(tripForm.startOdometer||0)).toFixed(1)} miles</div>}
            <label style={S.lbl}>Miles *</label>
            <input type="number" style={S.inp} placeholder="Auto-fills from odometer" value={tripForm.miles} onChange={e=>setTripForm(f=>({...f,miles:e.target.value}))}/>
            <label style={S.lbl}>Notes</label>
            <input style={S.inp} placeholder="Optional" value={tripForm.notes} onChange={e=>setTripForm(f=>({...f,notes:e.target.value}))}/>
            <div style={S.br}><button style={S.btn} onClick={saveTrip}>{editingId?"Update":"Save Trip"}</button><button style={S.bgh} onClick={()=>{setModal(null);setEditingId(null);setTripForm(blankTrip);}}>Cancel</button></div>
          </div>
        </div>
      )}

      {/* -- LEAD / PIPELINE MODAL -- */}
      {modal==="lead"&&(
        <div style={S.modal}>
          <div style={S.mbox}>
            <div style={S.mt}>{editingId?"Edit Lead":"Add Lead"}</div>
            <div style={S.row}>
              <div style={{flex:1}}><label style={S.lbl}>Date *</label><input type="date" style={S.inp} value={leadForm.date} onChange={e=>setLeadForm(f=>({...f,date:e.target.value}))}/></div>
              <div style={{flex:2}}><label style={S.lbl}>Customer Name *</label><input style={S.inp} placeholder="e.g. John Smith" value={leadForm.customer} onChange={e=>setLeadForm(f=>({...f,customer:e.target.value}))}/></div>
            </div>
            <div style={S.row}>
              <div style={{flex:1}}><label style={S.lbl}>Phone</label><input style={S.inp} placeholder="(412) 555-0000" value={leadForm.phone} onChange={e=>setLeadForm(f=>({...f,phone:e.target.value}))}/></div>
              <div style={{flex:2}}><label style={S.lbl}>Address</label><input style={S.inp} placeholder="e.g. 123 Main St, Monessen" value={leadForm.address} onChange={e=>setLeadForm(f=>({...f,address:e.target.value}))}/></div>
            </div>
            <div style={S.row}>
              <div style={{flex:1}}><label style={S.lbl}>Job Type</label>
                <select style={S.sel} value={leadForm.jobType} onChange={e=>setLeadForm(f=>({...f,jobType:e.target.value}))}>
                  <option value="">-- Select --</option>
                  {["Junk Removal","Estate Cleanout","Yard Cleanup","Demolition","Dump Run","Moving Help","Other"].map(t=><option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div style={{flex:1}}><label style={S.lbl}>Est. Amount ($)</label><input type="number" style={S.inp} placeholder="0.00" value={leadForm.estimatedAmount} onChange={e=>setLeadForm(f=>({...f,estimatedAmount:e.target.value}))}/></div>
            </div>
            <label style={S.lbl}>Status</label>
            <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
              {[["new","New",C.blue],["estimate_sent","Estimate Sent",C.yellow],["won","Won",C.teal],["scheduled","Scheduled",C.blue],["lost","Lost",C.red]].map(([v,lab,col])=>(
                <button key={v} style={{...S.tb(leadForm.status===v,col),flex:"none",padding:"6px 10px",fontSize:"11px"}} onClick={()=>setLeadForm(f=>({...f,status:v}))}>{lab}</button>
              ))}
            </div>
            {(leadForm.status==="won"||leadForm.status==="scheduled")&&<>
              <label style={S.lbl}>Scheduled Date</label>
              <input type="date" style={S.inp} value={leadForm.scheduledDate} onChange={e=>setLeadForm(f=>({...f,scheduledDate:e.target.value}))}/>
            </>}
            <label style={S.lbl}>Notes</label>
            <input style={S.inp} placeholder="Details about the job..." value={leadForm.notes} onChange={e=>setLeadForm(f=>({...f,notes:e.target.value}))}/>
            <div style={S.br}><button style={S.btn} onClick={saveLead}>{editingId?"Update":"Save Lead"}</button><button style={S.bgh} onClick={()=>{setModal(null);setEditingId(null);setLeadForm(blankLead);}}>Cancel</button></div>
          </div>
        </div>
      )}

      {/* -- START TRIP MODAL -- */}
      {modal==="startTrip"&&<StartTripModal onStart={startActiveTrip} onCancel={()=>setModal(null)} lastTripEndOdo={lastTripEndOdo} S={S} C={C}/>}

      {/* -- END TRIP MODAL -- */}
      {modal==="endTrip"&&activeTrip&&(
        <div style={S.modal}>
          <div style={{...S.mbox,maxWidth:"420px"}}>
            <div style={S.mt}>■ End Trip</div>
            {activeTrip.startOdometer&&<div style={{...S.card,background:C.tealD,border:`1px solid ${C.teal}44`,fontSize:"12px",marginBottom:"8px"}}>
              Started at <strong>{activeTrip.startOdometer}</strong> on {fmtDate(activeTrip.date)}
              {(()=>{const elapsed=Math.floor((Date.now()-activeTrip.startedAt)/60000);const hrs=Math.floor(elapsed/60),mins=elapsed%60;return <span style={{color:C.muted}}> · {hrs>0?`${hrs}h ${mins}m`:`${mins}m`} elapsed</span>;})()}
            </div>}
            <div style={S.row}>
              <div style={{flex:1}}>
                <label style={S.lbl}>Ending Odometer</label>
                <input type="number" style={S.inp} placeholder="e.g. 42165" value={endTripForm.endOdometer}
                  onChange={e=>setEndTripForm(f=>({...f,endOdometer:e.target.value}))}/>
                {endTripForm.endOdometer&&activeTrip.startOdometer&&<div style={{fontSize:"11px",color:C.blue,marginTop:"3px"}}>
                  {Math.max(0,parseFloat(endTripForm.endOdometer||0)-parseFloat(activeTrip.startOdometer||0)).toFixed(1)} miles
                </div>}
              </div>
            </div>
            <label style={S.lbl}>Description *</label>
            <input style={S.inp} placeholder="e.g. Dump run to Rostraver" value={endTripForm.desc}
              onChange={e=>setEndTripForm(f=>({...f,desc:e.target.value}))}/>
            <label style={S.lbl}>Notes</label>
            <input style={S.inp} placeholder="Optional" value={endTripForm.notes}
              onChange={e=>setEndTripForm(f=>({...f,notes:e.target.value}))}/>
            <div style={S.br}>
              <button style={{...S.btn,background:C.teal}} onClick={endActiveTrip}>Save Trip</button>
              <button style={S.bgh} onClick={()=>setModal(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* -- GLOBAL SEARCH OVERLAY -- */}
      {globalSearch&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:300,display:"flex",flexDirection:"column",alignItems:"center",paddingTop:"60px",padding:"60px 16px 16px"}} onClick={e=>e.target===e.currentTarget&&setGlobalSearch(false)}>
          <div style={{width:"100%",maxWidth:"680px"}}>
            {/* Search input */}
            <div style={{position:"relative",marginBottom:"16px"}}>
              <input
                autoFocus
                style={{...S.inp,fontSize:"18px",padding:"14px 16px 14px 48px",borderRadius:"12px",border:`1px solid ${C.border}`,background:C.surface}}
                placeholder="Search expenses, jobs, rent payments..."
                value={globalQuery}
                onChange={e=>setGlobalQuery(e.target.value)}
                onKeyDown={e=>e.key==="Escape"&&setGlobalSearch(false)}
              />
              <span style={{position:"absolute",left:"16px",top:"50%",transform:"translateY(-50%)",fontSize:"18px",pointerEvents:"none"}}>🔍</span>
              {globalQuery&&<button onClick={()=>setGlobalQuery("")} style={{position:"absolute",right:"14px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"20px",lineHeight:1}}>×</button>}
            </div>

            {/* Results */}
            {globalQuery.length>1&&(()=>{
              const q = globalQuery.toLowerCase();
              const matchExp = expenses.filter(e=>
                e.desc.toLowerCase().includes(q)||
                (e.payee||"").toLowerCase().includes(q)||
                (e.notes||"").toLowerCase().includes(q)||
                e.category.toLowerCase().includes(q)
              ).slice(0,15);
              const matchInc = income.filter(i=>
                (i.customer||"").toLowerCase().includes(q)||
                (i.notes||"").toLowerCase().includes(q)||
                (i.jobType||"").toLowerCase().includes(q)
              ).slice(0,8);
              const total = matchExp.length + matchInc.length;

              if(total===0) return (
                <div style={{textAlign:"center",color:C.muted,padding:"40px",fontSize:"14px"}}>
                  No results for "{globalQuery}"
                </div>
              );

              return (
                <div style={{background:C.surface,borderRadius:"12px",border:`1px solid ${C.border}`,overflow:"hidden",maxHeight:"60vh",overflowY:"auto"}}>
                  {matchExp.length>0&&<>
                    <div style={{padding:"10px 16px",fontSize:"10px",color:C.muted,letterSpacing:"2px",textTransform:"uppercase",borderBottom:`1px solid ${C.border}`,background:C.faint}}>
                      Expenses ({matchExp.length})
                    </div>
                    {matchExp.map(e=>{
                      const typeLabel="Hauling";
                      const typeCol=C.orange;
                      return(
                        <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:`1px solid ${C.faint}`,cursor:"pointer"}}
                          onClick={()=>{setGlobalSearch(false);openViewExpense(e);}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                              <span style={S.badge(typeCol)}>{typeLabel}</span>
                              <span style={{fontWeight:"600",fontSize:"13px"}}>{e.desc}</span>
                              {e.receiptB64&&<span style={{fontSize:"11px"}}>🧾</span>}
                            </div>
                            <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{fmtDate(e.date)} · {e.category} · {e.payee||"--"}</div>
                          </div>
                          <div style={{fontWeight:"700",color:C.red,marginLeft:"12px",whiteSpace:"nowrap"}}>{fmt(e.amount)}</div>
                        </div>
                      );
                    })}
                  </>}
                  {matchInc.length>0&&<>
                    <div style={{padding:"10px 16px",fontSize:"10px",color:C.muted,letterSpacing:"2px",textTransform:"uppercase",borderBottom:`1px solid ${C.border}`,background:C.faint}}>
                      Income ({matchInc.length})
                    </div>
                    {matchInc.map(i=>{
                      return(
                        <div key={i.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:`1px solid ${C.faint}`,cursor:"pointer"}}
                          onClick={()=>{setGlobalSearch(false);setViewingJob(i);setModal("viewJob");}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                              <span style={S.badge(C.teal)}>{i.jobType}</span>
                              <span style={{fontWeight:"600",fontSize:"13px"}}>{i.customer}</span>
                            </div>
                            <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{fmtDate(i.date)} · {i.paymentMethod}{i.notes?" · "+i.notes:""}</div>
                          </div>
                          <div style={{fontWeight:"700",color:C.teal,marginLeft:"12px",whiteSpace:"nowrap"}}>{fmt(i.amount)}</div>
                        </div>
                      );
                    })}
                  </>}
                </div>
              );
            })()}

            {globalQuery.length<=1&&(
              <div style={{textAlign:"center",color:C.muted,padding:"32px",fontSize:"13px"}}>
                Type at least 2 characters to search
              </div>
            )}

            <div style={{textAlign:"center",marginTop:"12px",fontSize:"11px",color:C.muted}}>
              Press Esc to close · Click any result to view/edit
            </div>
          </div>
        </div>
      )}

      {/* -- QUICK NEW modal -- */}
      {quickNew&&(
        <div style={S.modal} onClick={e=>e.target===e.currentTarget&&setQuickNew(false)}>
          <div style={{...S.mbox,maxWidth:"400px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
              <div style={S.mt}>What are you logging?</div>
              <button onClick={()=>setQuickNew(false)} style={S.xBtn}>×</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
              <button style={{padding:"16px",border:`1px solid ${C.teal}44`,borderRadius:"10px",background:C.tealD,color:C.teal,cursor:"pointer",fontSize:"14px",fontWeight:"700",textAlign:"left",display:"flex",alignItems:"center",gap:"12px"}}
                onClick={()=>{setQuickNew(false);setJobForm(blankJob);setEditingId(null);setModal("job");}}>
                <span style={{fontSize:"24px"}}>🚛</span>
                <div><div>Hauling Job</div><div style={{fontSize:"11px",fontWeight:"400",color:C.muted,marginTop:"2px"}}>Junk removal or estate cleanout</div></div>
              </button>
              <button style={{padding:"16px",border:`1px solid ${C.blue}44`,borderRadius:"10px",background:C.blueD,color:C.blue,cursor:"pointer",fontSize:"14px",fontWeight:"700",textAlign:"left",display:"flex",alignItems:"center",gap:"12px"}}
                onClick={()=>{setQuickNew(false);setExpForm(blankExp);setReceiptState("idle");setReceiptData(null);setExpModalContext(null);setEditingId(null);setModal("expense");}}>
                <span style={{fontSize:"24px"}}>📋</span>
                <div><div>Expense</div><div style={{fontSize:"11px",fontWeight:"400",color:C.muted,marginTop:"2px"}}>Fuel, dump fees, supplies, etc.</div></div>
              </button>
              <button style={{padding:"16px",border:`1px solid ${C.purple}44`,borderRadius:"10px",background:C.purpleD,color:C.purple,cursor:"pointer",fontSize:"14px",fontWeight:"700",textAlign:"left",display:"flex",alignItems:"center",gap:"12px"}}
                onClick={()=>{setQuickNew(false);setTripForm(blankTrip);setEditingId(null);setModal("trip");}}>
                <span style={{fontSize:"24px"}}>🛣</span>
                <div><div>Log Mileage</div><div style={{fontSize:"11px",fontWeight:"400",color:C.muted,marginTop:"2px"}}>Business trip or delivery</div></div>
              </button>
            </div>
          </div>
        </div>
      )}

      </>}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
